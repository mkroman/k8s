{{- if .Values.renovate.secrets }}
{{- if .Values.renovate.existingSecret }}
{{- fail "Cannot use both renovate.existingSecret and renovate.secrets. Pick one credential source." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "renovate.secretName" . | quote }}
  labels:
    {{- include "renovate.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.renovate.secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
