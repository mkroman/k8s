{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "renovate.fullname" . | quote }}
  labels:
    {{- include "renovate.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "renovate.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
{{- end }}
