{{- if .Values.service.httpsPort }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "kanidm.fullname" . }}-test-connection"
  labels:
    {{- include "kanidm.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  # Kanidm terminates TLS itself, so the test needs to ignore the certificate (it is
  # issued for the public domain, not the service name) and just check that the server
  # responds on /status.
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: busybox:1.37
      command: ["wget"]
      args:
        - "--no-check-certificate"
        - "--spider"
        - "https://{{ include "kanidm.fullname" . }}:{{ .Values.service.httpsPort }}/status"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
      resources:
        requests:
          cpu: 10m
          memory: 8Mi
        limits:
          memory: 16Mi
{{- end }}
