apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kanidm.fullname" . }}
  labels:
    {{- include "kanidm.labels" . | nindent 4 }}
data:
  server.toml: |
    # Generated by the kanidm Helm chart from the `kanidm` values -- do not edit.
    # Option reference: https://kanidm.github.io/kanidm/stable/server_configuration.html
    #
    # Every option can also be set (and overridden) through `KANIDM_`-prefixed environment
    # variables; the environment always wins.
    version = "2"

    tls_chain = "/certs/tls.crt"
    tls_key = "/certs/tls.key"
    db_path = "/data/kanidm.db"
    bindaddress = {{ .Values.kanidm.bindAddress | toJson }}
    {{- if .Values.kanidm.ldap.enabled }}
    ldapbindaddress = {{ .Values.kanidm.ldap.bindAddress | toJson }}
    {{- end }}
    {{- with .Values.kanidm.db.fsType }}
    db_fs_type = {{ . | toJson }}
    {{- end }}
    {{- with .Values.kanidm.db.arcSize }}
    db_arc_size = {{ . }}
    {{- end }}

    # ⚠️  Changing `domain` WILL break registered credentials (WebAuthn, OAuth2, ...); if
    # you must, run `kanidmd domain rename` immediately afterwards.
    domain = {{ .Values.kanidm.domain | toJson }}
    origin = {{ include "kanidm.origin" . | toJson }}
    {{- with .Values.kanidm.logLevel }}
    log_level = {{ . | toJson }}
    {{- end }}
    {{- with .Values.kanidm.otelGrpcUrl }}
    otel_grpc_url = {{ . | toJson }}
    {{- end }}

    {{- $proxyProtocolV2 := .Values.kanidm.clientAddressInfo.http.proxyProtocolV2 | default list }}
    {{- $xForwardedFor := .Values.kanidm.clientAddressInfo.http.xForwardedFor | default list }}
    {{- if and (gt (len $proxyProtocolV2) 0) (gt (len $xForwardedFor) 0) }}
    {{- fail "kanidm.clientAddressInfo.http: only one of proxyProtocolV2 or xForwardedFor may be set" }}
    {{- end }}
    {{- if gt (len $proxyProtocolV2) 0 }}
    [http_client_address_info]
    proxy-v2 = {{ $proxyProtocolV2 | toJson }}
    {{- else if gt (len $xForwardedFor) 0 }}
    [http_client_address_info]
    x-forward-for = {{ $xForwardedFor | toJson }}
    {{- end }}
    {{- with .Values.kanidm.clientAddressInfo.ldap.proxyProtocolV2 | default list }}
    [ldap_client_address_info]
    proxy-v2 = {{ . | toJson }}
    {{- end }}

    {{- with .Values.kanidm.onlineBackup.schedule }}

    [online_backup]
    path = {{ $.Values.kanidm.onlineBackup.path | toJson }}
    schedule = {{ . | toJson }}
    versions = {{ $.Values.kanidm.onlineBackup.versions }}
    {{- end }}

    {{- with .Values.kanidm.extraConfig }}
    {{ . }}
    {{- end }}
