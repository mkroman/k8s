apiVersion: v2
name: ser2net
description: >-
  ser2net serial-to-TCP bridge for the Zigbee coordinator. Runs on the node
  that owns the USB adapter and exposes the serial port to Zigbee2MQTT over
  TCP, so the application itself does not need hostPath or privileged access.
type: application
version: 0.1.0
# Keep appVersion, SER2NET_VERSION in .github/workflows/container-images.yaml,
# and image.tag in values.yaml in sync. Renovate tracks upstream releases, but
# the Debian package revision must be checked before bumping all three.
# renovate: datasource=github-releases depName=cminyard/ser2net
appVersion: "4.6.8"
kubeVersion: ">=1.26.0-0"

home: https://github.com/cminyard/ser2net
sources:
  - https://github.com/cminyard/ser2net
  - https://github.com/cminyard/gensio
  - https://github.com/mkroman/k8s/tree/main/images/ser2net
keywords:
  - ser2net
  - serial
  - zigbee
maintainers:
  - name: mkroman
annotations:
  artifacthub.io/license: GPL-2.0-only
  artifacthub.io/images: |
    - name: ser2net
      image: ghcr.io/mkroman/ser2net:4.6.4-1
