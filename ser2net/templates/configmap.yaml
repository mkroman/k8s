{{- $connector := printf "serialdev,%s,%s" .Values.serial.devicePath .Values.serial.settings }}
{{- if .Values.serial.local }}
{{- $connector = printf "%s,local" $connector }}
{{- end }}
{{- if .Values.serial.dtr }}
{{- $connector = printf "%s,dtr=%s" $connector .Values.serial.dtr }}
{{- end }}
{{- if .Values.serial.rts }}
{{- $connector = printf "%s,rts=%s" $connector .Values.serial.rts }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ser2net.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ser2net.labels" . | nindent 4 }}
data:
  ser2net.yaml: |
    %YAML 1.1
    ---
    connection: &zigbee
      accepter: tcp,0.0.0.0,{{ .Values.service.port }}
      connector: {{ $connector }}
      options:
        kickolduser: true
        max-connections: 1
