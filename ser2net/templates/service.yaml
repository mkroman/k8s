apiVersion: v1
kind: Service
metadata:
  name: {{ include "ser2net.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ser2net.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "ser2net.selectorLabels" . | nindent 4 }}
  ports:
    - name: serial
      port: {{ .Values.service.port }}
      targetPort: serial
      protocol: TCP
