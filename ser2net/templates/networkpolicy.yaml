{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ser2net.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ser2net.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ser2net.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only Zigbee2MQTT may talk to the raw serial stream.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.clientNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
  # ser2net only accepts connections; it never initiates one.
  egress: []
{{- end }}
