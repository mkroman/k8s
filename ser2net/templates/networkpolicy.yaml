{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ser2net.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ser2net.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ser2net.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only Zigbee2MQTT may talk to the raw serial stream.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.clientNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
  egress:
    {{- if .Values.networkPolicy.allowPackageDownload }}
    # DNS, plus Debian archive access for the install init container. This is
    # broad by destination because the policy cannot select only init
    # containers; it is limited to the ports apt needs.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
    {{- end }}
{{- end }}
