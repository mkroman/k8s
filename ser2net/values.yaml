# Default values for the ser2net chart.
#
# The bridge intentionally uses only the official Debian image and the Debian
# ser2net package. There is no official ser2net container image; instead an
# init container downloads the pinned package and extracts it into a shared
# emptyDir, and the main container runs that binary as UID 1000. This keeps
# the supply chain limited to Docker Official Images and Debian's archive.
#
# ser2net documentation:
#   https://github.com/cminyard/ser2net
#   ser2net.yaml(5), ser2net(8)

nameOverride: ""
fullnameOverride: ""

image:
  # -- Docker Official Image, used by both the install init container and the
  #    ser2net container. Keep the Debian suite in sync with
  #    `ser2net.version` below.
  repository: docker.io/library/debian
  # renovate: datasource=docker depName=debian
  tag: "13.7-slim"
  pullPolicy: IfNotPresent

# -- List of image pull secrets for private registries.
imagePullSecrets: []

# -- Debian package installed by the init container. Pin the version so the
#    extracted userspace does not change between Pod restarts. Check the
#    available version with `apt-cache policy ser2net` inside the image.
ser2net:
  version: "4.6.4-1"
  # -- Directory in the shared emptyDir where ser2net and its dependencies
  #    are extracted. The main container runs the binary from here.
  root: /ser2net-root

# -- Number of bridge replicas. Zigbee2MQTT needs exclusive access to the
#    coordinator, so keep this at one.
replicaCount: 1

service:
  # -- Keep the bridge cluster-internal. The protocol is raw, unauthenticated
  #    serial data and must not be exposed outside the cluster.
  type: ClusterIP
  # -- TCP port Zigbee2MQTT connects to (`tcp://<host>:<port>`).
  port: 6638

serial:
  # -- Host serial device. Prefer the stable /dev/serial/by-id/... path once
  #    it is known on the selected node. Keep the device node on the node at
  #    this path; the chart does not create it.
  devicePath: /dev/ttyUSB0
  # -- ser2net serialdev settings: baud rate, parity, data bits and stop bits.
  #    A Z-Stack coordinator uses 115200 8N1.
  settings: "115200n81"
  # -- GID with access to the device on the node. Debian and Ubuntu use 20
  #    (dialout); verify with `stat -c %g /dev/ttyUSB0`.
  groupId: 20
  # -- Ignore modem control lines. USB serial adapters generally do not
  #    provide DCD/DSR, so this should stay enabled.
  local: true

# -- Node selector for the USB coordinator. The node-feature-discovery chart
#    sets this label for the Silicon Labs CC2652RB adapter.
nodeSelector:
  feature.node.kubernetes.io/zigbee-coordinator: "true"

tolerations: []
affinity: {}

podAnnotations: {}
podLabels: {}

# -- Pod-level security context. fsGroup makes the extracted package tree
#    readable by the unprivileged ser2net process; `serial.groupId` is added
#    to supplementalGroups by the Deployment template.
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

# -- Container security context. The hostPath device is not added to the
#    container device cgroup, so this one small process must be privileged to
#    open it. It still runs as UID 1000, keeps a read-only root filesystem,
#    and uses the device's group. Do not add capabilities here: a privileged
#    container ignores the allowlist.
securityContext:
  privileged: true
  allowPrivilegeEscalation: true
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

# -- The install init container needs root for apt-get/dpkg-deb. It has no
#    device access and writes only to the shared emptyDir.
installSecurityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: false
  runAsUser: 0
  runAsGroup: 0

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

probes:
  readiness:
    periodSeconds: 10
  liveness:
    periodSeconds: 30

networkPolicy:
  # -- Restrict the bridge to the Zigbee2MQTT namespace and the package
  #    download used by the init container.
  enabled: true
  # -- Namespace allowed to connect to the serial port.
  clientNamespace: zigbee2mqtt
  # -- Allow DNS and HTTP(S) egress so the init container can download the
  #    pinned Debian package. Disable if the package is available from a
  #    local mirror or the image is pre-baked.
  allowPackageDownload: true

# -- Grace period for ser2net to close the serial port and TCP connection.
terminationGracePeriodSeconds: 10
