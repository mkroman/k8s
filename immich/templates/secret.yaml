{{- /*
Inline Redis credentials are an opt-in testing convenience only. Preferred
flow: create the Secret externally (it also backs the database or any other
Immich credential needs) and reference it via redis.existingSecret.
*/}}
{{- if or .Values.redis.username .Values.redis.password }}
{{- if .Values.redis.existingSecret }}
{{- fail "Cannot use both redis.existingSecret and inline redis.username/redis.password. Pick one credential source." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "immich.redisSecretName" . | quote }}
  labels:
    {{- include "immich.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
type: Opaque
stringData:
  {{ .Values.redis.usernameKey }}: {{ required "redis.username is required when redis.password is set" .Values.redis.username | quote }}
  {{ .Values.redis.passwordKey }}: {{ required "redis.password is required when redis.username is set" .Values.redis.password | quote }}
{{- end }}
