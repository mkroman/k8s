{{- if .Values.machineLearning.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "immich.machineLearningName" . }}
  labels:
    {{- include "immich.labels" . | nindent 4 }}
    app.kubernetes.io/component: machine-learning
spec:
  replicas: {{ .Values.machineLearning.replicas }}
  strategy:
    type: {{ .Values.machineLearning.strategy }}
  selector:
    matchLabels:
      {{- include "immich.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: machine-learning
  template:
    metadata:
      labels:
        {{- include "immich.podLabels" (dict "ctx" . "component" "machine-learning") | nindent 8 }}
      {{- with .Values.machineLearning.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "immich.serviceAccountName" . | quote }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.machineLearning.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.machineLearning.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.machineLearning.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- /* Model cache; matches MACHINE_LEARNING_CACHE_FOLDER upstream default.
             An existing claim always takes precedence; otherwise a chart-managed
             PVC is used when enabled, else ephemeral storage. */}}
        {{- if .Values.machineLearning.persistence.cache.existingClaim }}
        - name: cache
          persistentVolumeClaim:
            claimName: {{ .Values.machineLearning.persistence.cache.existingClaim | quote }}
        {{- else if .Values.machineLearning.persistence.cache.enabled }}
        - name: cache
          persistentVolumeClaim:
            claimName: {{ printf "%s-ml-cache" (include "immich.fullname" .) | quote }}
        {{- else }}
        - name: cache
          emptyDir: {}
        {{- end }}
        {{- /* Writable dot-dirs, as mounted by the official rootless compose. */}}
        - name: dot-cache
          emptyDir: {}
        - name: dot-config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- with .Values.machineLearning.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      containers:
        - name: immich-machine-learning
          image: {{ include "immich.image" (dict "ctx" . "image" .Values.machineLearning.image) | quote }}
          imagePullPolicy: {{ default .Values.image.pullPolicy .Values.machineLearning.image.pullPolicy }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range $key, $value := .Values.machineLearning.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.machineLearning.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /ping
              port: http
            # Model loading can delay readiness on fresh caches.
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: cache
              mountPath: /cache
            - name: dot-cache
              mountPath: /.cache
            - name: dot-config
              mountPath: /.config
            - name: tmp
              mountPath: /tmp
            {{- with .Values.machineLearning.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.machineLearning.resources | nindent 12 }}
{{- end }}
