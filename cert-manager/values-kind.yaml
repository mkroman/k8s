# Ephemeral kind clusters do not have the production sealed-secrets key.
# The controller, CRDs, HTTP-01 and staging ClusterIssuers are still
# exercised; the Cloudflare DNS-01 issuer is production-only.
sealedSecret:
  enabled: false

clusterIssuer:
  letsEncryptProductionDns:
    enabled: false

cert-manager:
  # Prometheus Operator depends on cert-manager, so its CRDs do not exist when
  # the cert-manager e2e Application runs on its own.
  prometheus:
    servicemonitor:
      enabled: false
