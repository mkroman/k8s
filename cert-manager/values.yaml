cert-manager:
  installCRDs: true

  prometheus:
    servicemonitor:
      enabled: true
      interval: 30s
      scrapeTimeout: 10s
      labels:
        metrics.uplink.io/monitor: prometheus

clusterIssuer:
  # -- Enable the production letsencrypt cert issuer.
  letsEncryptProduction:
    enabled: true
  # -- Enable the staging letsencrypt cert issuer.
  letsEncryptStaging:
    enabled: true
  # -- Enable the self-signed certificate issuer.
  selfSigned:
    enabled: true

sealedSecret:
  # -- Create the SealedSecret with the Cloudflare API token.
  # Disable this when deploying cert-manager without the sealed-secrets
  # controller or without the production encryption key (for example in e2e
  # clusters).
  enabled: true
