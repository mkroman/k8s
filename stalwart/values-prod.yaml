# Production overrides for Stalwart.
#
# The mail domain, default hostname, listeners, TLS Certificate object, DKIM,
# DNS management, accounts, and the Prometheus exporter are configured in
# Stalwart's database. This file only covers Kubernetes-side settings.
#
# Prerequisites:
#   - A SealedSecret named `stalwart-recovery-admin` containing:
#       STALWART_RECOVERY_ADMIN: admin:<password>
#       STALWART_USER: admin
#       STALWART_PASSWORD: <same password>
#   - A SealedSecret named `stalwart-metrics` containing:
#       username: prometheus
#       password: <metrics password>
#   - A Secret named `stalwart-postgres` containing the complete Stalwart
#     `config.json`; see below and the chart README.
#   - The `letsencrypt-production` ClusterIssuer. It uses HTTP-01 through
#     Traefik, so mail.rwx.im needs a DNS-01 issuer (create one and override
#     certificate.issuerRef) or an existing wildcard certificate.
#   - DNS A/AAAA records for mail.rwx.im and the autoconfiguration names, plus
#     a PTR record and port 25 reachability.
#
# Create these Secrets before the first sync; the pod waits for the config and
# recovery administrator Secrets.

service:
  mail:
    type: LoadBalancer
    externalTrafficPolicy: Local
    # Pin a Cilium LB IPAM address once one is assigned, for example:
    # annotations:
    #   lbipam.cilium.io/ips: 10.0.3.10

# These non-secret fields drive chart validation and the NetworkPolicy
# database egress rule. The mounted config.json comes from configSecret below;
# keep both definitions in sync.
config:
  "@type": PostgreSql
  host: postgres-rw.rwx.svc.cluster.local
  port: 5432
  database: stalwart_prod

# The full config.json, including the database username and password, lives in
# this Secret. See the README for the expected JSON.
configSecret:
  name: stalwart-postgres
  key: config.json

# PostgreSQL holds the data store; no local data PVC is needed.
persistence:
  enabled: false

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "4"
    memory: 4Gi

recoveryAdmin:
  enabled: true
  existingSecret: stalwart-recovery-admin
  existingSecretKey: STALWART_RECOVERY_ADMIN

publicUrl: https://mail.rwx.im

certificate:
  enabled: true
  create: true
  commonName: mail.rwx.im
  dnsNames:
    - mail.rwx.im
    - autoconfig.rwx.im
    - autodiscover.rwx.im
    - mta-sts.rwx.im
    - ua-auto-config.rwx.im
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-production
    group: cert-manager.io
  reload:
    enabled: true
    credentialsSecret: stalwart-recovery-admin

metrics:
  exporter:
    # Enable the exporter in Stalwart's database first, then set this to true
    # so the exporter-dependent alerts are rendered.
    enabled: false
  serviceMonitor:
    enabled: true
  prometheusRule:
    enabled: true
  auth:
    existingSecret: stalwart-metrics

networkPolicy:
  managementIngress:
    namespaces:
      - monitoring
