{{- if and .Values.recoveryAdmin.enabled (not .Values.recoveryAdmin.existingSecret) .Values.recoveryAdmin.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stalwart.fullname" . }}-recovery-admin
  labels:
    {{- include "stalwart.labels" . | nindent 4 }}
    app.kubernetes.io/component: recovery-admin
type: Opaque
stringData:
  {{ .Values.recoveryAdmin.existingSecretKey }}: {{ printf "%s:%s" .Values.recoveryAdmin.username .Values.recoveryAdmin.password | quote }}
{{- end }}
