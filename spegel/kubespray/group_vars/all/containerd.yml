---
# Containerd configuration for Spegel compatibility.
#
# Place at:  inventory/<cluster>/group_vars/all/containerd.yml
# Applies to the `all` inventory group (control-plane and workers alike) —
# Spegel must have identical containerd settings on every node.
#
# Reference: roles/container-engine/containerd/defaults/main.yml
# https://github.com/kubernetes-sigs/kubespray/blob/master/roles/container-engine/containerd/defaults/main.yml

# ── Why this override exists ────────────────────────────────────────────────
# `discard_unpacked_layers = true` allows containerd's garbage collector to
# delete layer blobs from the content store (/var/lib/containerd/
# io.containerd.content.v1.content) as soon as they have been unpacked into
# the overlayfs snapshotter. Spegel serves peers by streaming blobs straight
# out of that content store — with the layers discarded there is nothing left
# to serve, every P2P lookup falls back to the upstream registry, and Spegel
# (>= v0.0.16) actually refuses to start when it detects the setting enabled.
#
# Version nuance (verified in Kubespray's config.toml.j2):
#   * Kubespray v2.25 (containerd 1.7.x): renders
#     `discard_unpacked_layers = true` into /etc/containerd/config.toml →
#     REQUIRED for Spegel.
#   * Kubespray master (containerd >= 2.1, currently 2.3.x): the option no
#     longer exists in the CRI config template (removed upstream; default is
#     `false`) and is NOT rendered. The override is a harmless no-op there,
#     but keep it so a containerd downgrade can never silently re-enable
#     discarding.
containerd_discard_unpacked_layers: false

# ── certs.d ownership ───────────────────────────────────────────────────────
# Kubespray renders `containerd_registries_mirrors` into
# /etc/containerd/certs.d/<prefix>/hosts.toml. Spegel's init container writes
# its own per-registry hosts.toml files into the same directory tree.
#
# Default (recommended): empty the list. Spegel becomes the single owner of
# certs.d and its `prependExisting` behaviour keeps upstream fallbacks intact.
# Nothing is lost — the stock entry below is only a docker.io passthrough
# (registry-1.docker.io) that Spegel already falls back to natively.
containerd_registries_mirrors: []

# If you instead keep real mirrors here (e.g. a corporate pull-through cache
# or private registries with `ca:`/`client:` settings), leave the list as is
# and set `spegel.prependExisting: true` in the Helm values (already done in
# spegel/values.yaml). Note the ownership caveat: an Ansible re-run re-renders
# hosts.toml without the Spegel mirror line until the Spegel pod on that node
# restarts — prefer the empty list unless you have custom TLS/auth config.
# containerd_registries_mirrors:
#   - prefix: registry.example.com
#     mirrors:
#       - host: https://registry.example.com
#         capabilities: ["pull", "resolve"]
#         ca: ["/etc/certs/mirror.pem"]

# ── Sanity references (do not change — Spegel depends on these defaults) ────
# containerd_state_dir: "/run/containerd"           # → socket /run/containerd/containerd.sock
# containerd_cfg_dir: /etc/containerd               # → config_path /etc/containerd/certs.d
# containerd_storage_dir: "/var/lib/containerd"     # → content store path
