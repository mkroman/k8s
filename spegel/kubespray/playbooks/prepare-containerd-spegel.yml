---
# Targeted playbook: apply the Spegel containerd compatibility settings
# (group_vars/all/containerd.yml) without a full cluster run.
#
# Copy into a Kubespray checkout as:
#   <kubespray>/playbooks/spegel-containerd-prep.yml
# (paths below assume it lives in Kubespray's playbooks/ directory)
#
# It re-renders /etc/containerd/config.toml (and, if you kept
# containerd_registries_mirrors, the certs.d hosts.toml files), then restarts
# containerd on changed nodes only — one node at a time so workloads keep
# running. Nodes whose config is already correct are skipped untouched.
#
# Usage (from the Kubespray repo root):
#   ansible-playbook \
#     -i inventory/<cluster>/hosts.yaml \
#     -b \
#     playbooks/spegel-containerd-prep.yml
#
# Roll out in small batches or to single nodes first:
#   ansible-playbook -i inventory/<cluster>/hosts.yaml -b \
#     --limit "node1" playbooks/spegel-containerd-prep.yml
#
# For a full-fidelity official run instead, use the stock playbooks:
#   ansible-playbook -i inventory/<cluster>/hosts.yaml -b playbooks/cluster.yml
#   # or, rolling: playbooks/upgrade-cluster.yml

- name: Prepare containerd for Spegel (layer retention + certs.d)
  hosts: k8s_cluster
  become: true
  gather_facts: true

  # Never restart containerd on more than one node at a time; a containerd
  # restart briefly stalls pod startup and image pulls on that node.
  serial: 1

  roles:
    # Provides containerd_version, download_defaults, bin_dir, ... required by
    # the containerd role's download logic and version-dependent templating.
    - { role: kubespray_defaults, tags: [defaults] }
    - { role: container-engine/containerd, tags: [containerd] }

  post_tasks:
    - name: Verify discard_unpacked_layers is absent or false in config.toml
      ansible.builtin.command: >-
        grep -E '^\s*discard_unpacked_layers' /etc/containerd/config.toml || true
      changed_when: false
      register: discard_line

    - name: Report discard_unpacked_layers status
      vars:
        line: "{{ discard_line.stdout | trim }}"
        # containerd < 2.1 renders the line explicitly; >= 2.1 omits it and
        # defaults to false.
        spegel_ok: "{{ line | length == 0 or 'false' in line }}"
      ansible.builtin.debug:
        msg: >-
          {{ 'OK — Spegel compatible' if spegel_ok else 'FAIL — Spegel will refuse to start' }}:
          discard_unpacked_layers = {{ line if line | length > 0 else '(not rendered; containerd >= 2.1, default false)' }}
