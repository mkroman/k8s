apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: e2e
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: e2e
  source:
    repoURL: http://invalid
    targetRevision: HEAD
    path: apps
    helm:
      valuesObject:
        applications: []
        argoCDApplication:
          enabled: false
        newApplications: []
        projects: []
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
