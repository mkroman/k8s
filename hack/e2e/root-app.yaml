apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: e2e
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: e2e
  source:
    repoURL: http://invalid
    targetRevision: HEAD
    path: apps
    helm:
      valuesObject:
        applications: []
        argoCDApplication:
          enabled: false
        projects: []
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # The runner creates the child Applications without automated sync for the
  # dry-run phase, then patches the live Applications to re-enable it. The
  # root app owns those Applications and self-heals drift, so ignore the one
  # field the runner intentionally diverges on; otherwise the root reverts the
  # patch and a child can stay paused until the run times out.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /spec/syncPolicy/automated
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
