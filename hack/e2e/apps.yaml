# Applications exercised by the Argo CD end-to-end workflow.
#
# Add an app here only after verifying that it becomes Synced and Healthy in a
# kind cluster. The workflow selects only applications whose source path,
# Application values, or e2e entry changed in the pull request.
#
# requires lists other e2e apps that must be healthy first. The runner deploys
# them as real Argo CD Applications, in dependency order, before the selected
# app. An app can be both a prerequisite and a test target.
#
# prometheus_targets optionally declares a Prometheus Service and the job names
# whose targets must all be up after the app is healthy. The runner reads it
# generically, so more than one app can use it.
#
# resources optionally lists objects that must exist after the app is healthy.
# Use it to verify that resources such as ServiceMonitors and PodMonitors were
# actually deployed, not just rendered.
#
# helm_repositories optionally lists Helm chart repositories that CI must
# register before rendering charts with `helm dependency build`. Argo CD
# resolves its own chart sources, so this is only used by repository checks.
#
# requires_fresh_image marks an app whose probe needs the configured
# `e2e.pullImage` from values-kind.yaml absent from every kind node. The runner
# removes it on every run, reused clusters included. Pair it with retry_limit: 0
# when a retry would reuse the pulled image and invalidate the probe.
#
# requires_containerd_config verifies on every node that the containerd patch
# from kind.yaml (mirror config_path and isolated content sharing) is present.
#
# retry_limit overrides E2E_RETRY_LIMIT for the app. timeout_seconds overrides
# E2E_TIMEOUT_SECONDS for the app.
#
# stale_probe_resources optionally names the namespace, resources and pod label
# selectors that must be removed before a cold-image app is redeployed. Probes
# can create pods directly (not through Argo CD), and deleting an Application
# can leave its post-delete hook resources behind; either kind of leftover can
# keep the image in use or confuse a probe's own pod selection.
helm_repositories:
  - name: quickwit
    url: https://helm.quickwit.io
  - name: vector
    url: https://helm.vector.dev

apps:
  agentgateway:
    requires:
      - gateway-api
      - prometheus-operator
  # The ServiceMonitor is disabled in values-kind.yaml because Prometheus
  # Operator depends on cert-manager, so there is nothing to assert here.
  cert-manager: {}
  cloudnative-pg:
    requires:
      - cert-manager
      - prometheus-operator
  gateway-api: {}
  grafana:
    requires:
      - prometheus-operator
  monitoring:
    requires:
      - prometheus-operator
    timeout_seconds: 900
    # After the Application is healthy, query the Prometheus target API through
    # the Kubernetes service proxy. Every target for these jobs must be up.
    prometheus_targets:
      namespace: monitoring
      service: prometheus
      port: 9090
      jobs:
        - kubelet
        - kube-dns
        - apiserver
        - kube-scheduler
        - kube-controller-manager
  cluster-exporters:
    requires:
      - prometheus-operator
  prometheus-operator:
    requires:
      - cert-manager
    resources:
      - apiVersion: monitoring.coreos.com/v1
        kind: ServiceMonitor
        namespace: prometheus-operator
        name: prometheus-operator
  sealed-secrets:
    requires:
      - prometheus-operator
    resources:
      - apiVersion: monitoring.coreos.com/v1
        kind: PodMonitor
        namespace: kube-system
        name: sealed-secrets-controller
  # The PostSync probe verifies cross-node P2P layer serving against the
  # containerd mirror patch configured in kind.yaml. It needs the pull image
  # absent from every node, and an Argo CD retry would reuse the image pulled
  # by the failed attempt, so retries are disabled for this app.
  spegel:
    requires_fresh_image: true
    retry_limit: 0
    requires_containerd_config: true
    # Pods A and B are created through the Kubernetes API by the probe, not by
    # Argo CD. A failed run can leave them running and keep the pull image in
    # use. Deleting the previous Application also leaves the chart's post-delete
    # cleanup DaemonSet and wait pod behind; those pods match the probe's own
    # Spegel selector, so remove them too before redeploying.
    stale_probe_resources:
      namespace: spegel
      resource_names:
        - daemonset/spegel-cleanup
      pod_label_selectors:
        - e2e.spegel.io/pull
        - app.kubernetes.io/component in (cleanup,cleanup-wait)
  traefik:
    requires:
      - prometheus-operator
  vector-agent:
    requires:
      - prometheus-operator
      - vector-aggregator
    resources:
      - apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        namespace: vector
        name: vector-agent
      - apiVersion: v1
        kind: Service
        namespace: vector
        name: vector-agent
      - apiVersion: monitoring.coreos.com/v1
        kind: PodMonitor
        namespace: vector
        name: vector-agent
  vector-aggregator:
    requires:
      - prometheus-operator
    resources:
      - apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        namespace: vector
        name: vector-aggregator
      - apiVersion: v1
        kind: Service
        namespace: vector
        name: vector-aggregator
      - apiVersion: apps/v1
        kind: StatefulSet
        namespace: vector
        name: vector-aggregator
      - apiVersion: monitoring.coreos.com/v1
        kind: PodMonitor
        namespace: vector
        name: vector-aggregator
