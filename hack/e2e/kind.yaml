kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

# The control-plane is tainted by kind. Two workers keep anti-affinity
# workloads (for example the Prometheus Operator admission webhook) honest.
nodes:
  - role: control-plane
  - role: worker
  - role: worker

# kubeadm binds the scheduler and controller-manager metrics to localhost.
# Expose them on the node address so Prometheus can scrape them in e2e, matching
# the Kubespray layout. kind's patch helper translates the map form for
# kubeadm v1beta4 and preserves its enable-hostpath-provisioner default.
kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    scheduler:
      extraArgs:
        bind-address: 0.0.0.0
    controllerManager:
      extraArgs:
        bind-address: 0.0.0.0

# Spegel e2e: route registry pulls through the local mirror and keep layer
# blobs in the content store. This is the patch Spegel's own integration tests
# use, minus the `version` selector. kind merges a patch only when its
# `version` is absent or matches the base containerd config version; a
# mismatched patch is skipped silently. The current kind node image writes a
# version 2 config, so the legacy plugin IDs below apply as-is. Revisit those
# IDs if kind moves to a newer config version. Harmless for every other app.
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
    [plugins."io.containerd.grpc.v1.cri".containerd]
      discard_unpacked_layers = false
    [plugins."io.containerd.metadata.v1.bolt"]
      content_sharing_policy = "isolated"
