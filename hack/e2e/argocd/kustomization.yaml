apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - ../../../argo-cd/base

# The e2e runner only needs the application controller and repo server. Keep
# the optional API, UI, DEX, notifications and ApplicationSet components out of
# the test cluster so they cannot slow down or fail the bootstrap.
patches:
  - target:
      kind: Deployment
      name: argocd-applicationset-controller
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Deployment
      name: argocd-dex-server
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Deployment
      name: argocd-notifications-controller
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Deployment
      name: argocd-server
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0

  # public.ecr.aws rate-limits anonymous pulls from shared GitHub runner IPs.
  # The Google mirror serves the same Docker Hub image.
  - target:
      kind: Deployment
      name: argocd-redis
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: mirror.gcr.io/library/redis:8.2.3-alpine
