---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
spec:
  template:
    metadata:
      labels:
        # Distinguishes broker pods from e2e probe pods (which inherit
        # app.kubernetes.io/name: mosquitto from the base labels
        # transformer). The Service selector requires this label, so probe
        # pods can never become Service endpoints.
        app.kubernetes.io/component: broker
    spec:
      securityContext:
        # Defensive: guarantees the local-path PVC is writable by UID 1883.
        fsGroup: 1883
      volumes:
      # E2E only: the projected volume (configMap + mosquitto-passwd secret)
      # becomes a plain ConfigMap volume with the anonymous-listener config.
      # Keep the volume and mount names identical to base so the
      # volumeMounts stay valid.
      - name: mosquitto-config
        projected: null
        configMap:
          name: mosquitto-e2e-config
          # Explicit 0644 keeps the file readable by UID 1883 regardless of
          # how a Kustomize/Argo CD merge handles the base projected volume.
          defaultMode: 0644
      # The e2e test proves MQTT connectivity, not local-path storage. Keep
      # production on its PVC, but use pod-local storage here so a slow or
      # permission-sensitive local-path volume cannot crash-loop the broker.
      - name: mosquitto-data
        persistentVolumeClaim: null
        emptyDir: {}
