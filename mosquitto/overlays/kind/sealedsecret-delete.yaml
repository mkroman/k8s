---
# E2E only: a fresh sealed-secrets controller in the kind cluster generates
# its own key pair and cannot decrypt the sealed data, which would leave the
# app stuck in health-progression. Credentials are unnecessary there because
# the overlay switches mosquitto to an anonymous listener (and the
# Deployment volume no longer references the secret).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: mosquitto-passwd
  namespace: mosquitto
$patch: delete
