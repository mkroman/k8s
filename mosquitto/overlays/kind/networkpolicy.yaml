---
# E2E-only variant of the base limited-ingress policy (the base
# kustomization does not wire in its manifests/networkpolicy.yaml, so
# production deploys no policy; this overlay adds one because the kind e2e
# CNI enforces NetworkPolicy).
#
# Ingress mirrors the base intent: MQTT from in-cluster addresses only
# (pod CIDR and service CIDR are both inside 10.0.0.0/8 in kind).
#
# Egress is opened for in-cluster addresses for the broker pods selected by
# this policy. The probe Job is deliberately not selected: overlay resources
# do not receive the base labels transformer's app.kubernetes.io/name, so the
# probe keeps unrestricted egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: limited-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mosquitto
  policyTypes:
  - Egress
  - Ingress
  egress:
  - to:
    - ipBlock:
        cidr: 10.0.0.0/8
  ingress:
  - from:
    - ipBlock:
        cidr: 10.0.0.0/8
    ports:
    - port: 1883
