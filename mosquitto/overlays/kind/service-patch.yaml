---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
spec:
  # kind has no LoadBalancer implementation; ClusterIP is enough for the
  # in-cluster probe Job and the downstream zigbee2mqtt e2e app.
  type: ClusterIP
  externalTrafficPolicy: null
  loadBalancerIP: null
  selector:
    # Only broker pods are endpoints (see deployment-patch.yaml).
    app.kubernetes.io/component: broker
