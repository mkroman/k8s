apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
spec:
  replicas: 1
  template:
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1883
        runAsGroup: 1883
        fsGroup: 1883
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: mosquitto
        image: eclipse-mosquitto:2.0.22
        # Ubuntu's AppArmor mosquitto profile allows config reads only below
        # /etc/mosquitto. The image default is /mosquitto/config, so override
        # both the command and the config path to stay readable on hosts that
        # load that profile (GitHub Actions runners do).
        command:
        - /usr/sbin/mosquitto
        args:
        - -c
        - /etc/mosquitto/mosquitto.conf
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - NET_RAW
            - ALL
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 100m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 64Mi
        ports:
        - name: mqtt
          containerPort: 1883
        livenessProbe:
          failureThreshold: 3
          tcpSocket:
            port: 1883
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        readinessProbe:
          failureThreshold: 3
          tcpSocket:
            port: 1883
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        startupProbe:
          failureThreshold: 90
          tcpSocket:
            port: 1883
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        volumeMounts:
        - name: mosquitto-data
          mountPath: /var/lib/mosquitto
        # Mount the config and password files directly (subPath) so AppArmor
        # sees regular files at the allowed /etc/mosquitto paths. A directory
        # mount would expose the ConfigMap/Secret atomic-writer symlinks and
        # bypass those path rules on the target side of the symlink.
        - name: mosquitto-config
          mountPath: /etc/mosquitto/mosquitto.conf
          subPath: mosquitto.conf
          readOnly: true
        - name: mosquitto-passwd
          mountPath: /etc/mosquitto/passwords.db
          subPath: passwords.db
          readOnly: true
      volumes:
      - name: mosquitto-config
        configMap:
          name: mosquitto-config
          defaultMode: 0644
      - name: mosquitto-passwd
        secret:
          secretName: mosquitto-passwd
          defaultMode: 0440
      - name: mosquitto-data
        persistentVolumeClaim:
          claimName: mosquitto-data
  strategy:
    type: Recreate
