apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: production

  # Source of the application manifests
  source:
    repoURL: https://github.com/mkroman/k8s.git
    targetRevision: HEAD
    path: apps

  # Destination cluster and namespace to deploy the application
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated: {}
    # Argo CD adds pre/post-delete finalizers to child Applications whose
    # charts render delete hooks. SSA treats metadata.finalizers as a set and
    # server-side diff ignores the application controller's entries, so those
    # finalizers do not appear as permanent drift in this app-of-apps.
    syncOptions:
      - ServerSideApply=true
      - ServerSideDiff=true
