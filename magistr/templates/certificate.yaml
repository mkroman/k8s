{{- if and .Values.ingress.enabled .Values.ingress.tls.enabled .Values.ingress.tls.createCertificate }}
{{- $hosts := .Values.ingress.tls.hosts | default .Values.ingress.hosts }}
{{- $certificateName := .Values.ingress.tls.certificateName | default (include "magistr.fullname" .) }}
{{- $secretName := .Values.ingress.tls.secretName | default (printf "%s-tls" (include "magistr.fullname" .)) }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $certificateName }}
  labels:
    {{- include "magistr.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  commonName: {{ first $hosts | quote }}
  dnsNames:
    {{- range $hosts }}
    - {{ . | quote }}
    {{- end }}
  issuerRef:
    kind: {{ .Values.ingress.tls.issuerRef.kind | quote }}
    name: {{ .Values.ingress.tls.issuerRef.name | quote }}
  secretName: {{ $secretName | quote }}
{{- end }}
