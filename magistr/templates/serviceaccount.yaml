{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "magistr.serviceAccountName" . }}
  labels:
    {{- include "magistr.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The application never talks to the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
