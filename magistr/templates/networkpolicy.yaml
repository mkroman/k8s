{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "magistr.fullname" . }}
  labels:
    {{- include "magistr.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "magistr.selectorLabels" . | nindent 6 }}
  policyTypes:
    # Egress is intentionally not restricted: the database is external to this chart
    # and its address is not known here. Add a separate egress policy if needed.
    - Ingress
  ingress:
    {{- if .Values.networkPolicy.ingress.allowSameNamespace }}
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.service.containerPort }}
    {{- end }}
    {{- with .Values.networkPolicy.ingress.namespaces }}
    - from:
        {{- range . }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ $.Values.service.containerPort }}
    {{- end }}
{{- end }}
