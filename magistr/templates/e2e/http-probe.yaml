{{- if .Values.e2e.enabled }}
{{- $probeImage := required "e2e.probeImage is required when e2e.enabled is true" .Values.e2e.probeImage }}
{{- $timeout := int (required "e2e.timeoutSeconds is required when e2e.enabled is true" .Values.e2e.timeoutSeconds) }}
{{- $fullname := include "magistr.fullname" . }}
{{- /* The probe pod must not carry the application's name/instance labels: the app Service
       selects on those, and a probe pod without the http port would become a bad endpoint. */}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-e2e
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ printf "%s-e2e" $fullname }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: e2e-probe
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  # The retry loop must fit below this deadline.
  activeDeadlineSeconds: {{ add $timeout 30 }}
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ printf "%s-e2e" $fullname }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: e2e-probe
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          image: {{ $probeImage | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          env:
            - name: SERVICE_HOST
              value: {{ $fullname | quote }}
            - name: SERVICE_PORT
              value: {{ .Values.service.port | quote }}
            - name: TIMEOUT_SECONDS
              value: {{ $timeout | quote }}
          command:
            - /bin/sh
            - -ec
            - |
              set -eu
              url="http://${SERVICE_HOST}:${SERVICE_PORT}/"
              deadline=$(( $(date +%s) + TIMEOUT_SECONDS ))
              while :; do
                # `/` queries PostgreSQL, so a 200 proves database connectivity too.
                code="$(curl -fsS -o /dev/null -w '%{http_code}' "${url}" 2>/dev/null || true)"
                if [ "${code}" = "200" ]; then
                  echo "PASS: ${url} returned 200"
                  exit 0
                fi
                if [ "$(date +%s)" -ge "${deadline}" ]; then
                  echo "FAIL: ${url} did not return 200 within ${TIMEOUT_SECONDS}s (last status: ${code:-none})" >&2
                  exit 1
                fi
                sleep 2
              done
{{- end }}
