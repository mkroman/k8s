quickwit:
  environment:
    QW_DISABLE_TELEMETRY: 1
  environmentFrom:
    - secretRef:
        name: quickwit

  searcher:
    replicaCount: 3

    persistentVolume:
      enabled: true
      storage: "25Gi"
      storageClass: "ssd-gp1x1"

  indexer:
    replicaCount: 1

    persistentVolume:
      enabled: true
      storage: "50Gi"
      storageClass: "ssd-gp1x1"

  metastore:
    replicaCount: 1

    extraEnvFrom:
      - secretRef:
          name: quickwit-metastore

  # Quickwit configuration
  #
  # Warning: This config is writed directly into a configMap
  # to avoid passing sensitive value you can pass environment variables.
  # https://quickwit.io/docs/configuration/node-config#using-environment-variables-in-the-configuration
  config:
    version: 0.8
    listen_address: 0.0.0.0
    gossip_listen_port: 7282
    data_dir: /quickwit/qwdata
    default_index_root_uri: s3://quickwit-prod/indexes

    metastore:
      postgres:
        max_num_connections: 50

    storage:
      s3:
        endpoint: "https://s3.eu-central-003.backblazeb2.com"
        region: "eu-central-003"

    # OTLP log/trace ingestion is served by the indexer. This is enabled by
    # default in Quickwit 0.8.2; keep it explicit so a future default change
    # cannot disable the Vector sink endpoint silently.
    indexer:
      enable_otlp_endpoint: true

  # Deploy the ServiceMonitor so we can pick up metrics.
  serviceMonitor:
    enabled: true
    additionalLabels:
      metrics.uplink.io/monitor: prometheus

  prometheusRule:
    # -- Create the provided prometheus rule resources.
    enabled: true
    additionalLabels:
      metrics.uplink.io/monitor: prometheus

    rules:
      - alert: QuickwitSustainedHighThroughput
        # Calculates the per-second rate of successfully processed documents
        # over a 5-minute window, summed by index. Change "100" to a baseline
        # that makes sense for your cluster's standard volume.
        expr: sum by (index)
          (rate(quickwit_indexing_processed_docs_total{docs_processed_status="valid"}[5m])) > 100

        # The condition must be continuously met for 30 minutes before firing.
        for: 30m

        labels:
          severity: warning # Route this label in Alertmanager to your preferred channel
        annotations:
          summary: "Sustained high document throughput on Quickwit index '{{ $labels.index }}'"
          description: >-
            The Quickwit index '{{ $labels.index }}' has experienced a sustained indexing throughput
            of over 100 docs/sec for more than 30 minutes.  Current rate is {{ $value | humanize }}
            docs/sec.

  # Create the Kubernetes log index with an explicit mapping and retention.
  # Quickwit's OTLP trace/log indexes are auto-created by Quickwit itself and
  # are intentionally not declared here.
  bootstrap:
    enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

  seed:
    indexes:
      # Kubernetes container logs. This is a new index (v0_2), so the bootstrap
      # job creates it with this mapping; the old v0_1 index is left untouched
      # for its existing retention period.
      - version: 0.7
        index_id: vector-kubernetes_logs-v0_2
        doc_mapping:
          # Keep unknown fields out of the index while allowing the current
          # Vector schema. Add new top-level fields here before emitting them.
          mode: lenient
          field_mappings:
            - name: timestamp
              type: datetime
              input_formats: [rfc3339, unix_timestamp]
              output_format: rfc3339
              fast: true
              fast_precision: milliseconds
            - name: message
              type: text
              tokenizer: default
            - name: kubernetes
              type: json
              tokenizer: raw
              expand_dots: false
            - name: file
              type: text
              tokenizer: raw
              indexed: false
            - name: source_type
              type: text
              tokenizer: raw
              indexed: false
            - name: stream
              type: text
              tokenizer: raw
              fast: true
          timestamp_field: timestamp
        search_settings:
          default_search_fields: [message]
        retention:
          period: 30 days
          schedule: hourly
