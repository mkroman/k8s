{{- /* Empty secret.name means "no Secret" (see values-kind.yaml), which also
       means the committed SealedSecret must not be installed: kind has no
       Sealed Secrets controller/CRD. */}}
{{- if .Values.secret.name }}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: zigbee2mqtt-secrets
  namespace: zigbee2mqtt
spec:
  encryptedData:
    secret.yaml: 
  template:
    metadata:
      name: zigbee2mqtt-secrets
      namespace: zigbee2mqtt
{{- end }}
