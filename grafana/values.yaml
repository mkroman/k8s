grafana:
  admin:
    existingSecret: grafana-auth

  envFromSecret: grafana-env

  image:
    # renovate: datasource=docker depName=grafana/grafana
    repository: grafana/grafana
    tag: 13.3.0
    sha: ""

  imageRenderer:
    enabled: true

    image:
      # renovate: datasource=docker depName=grafana/grafana-image-renderer
      repository: grafana/grafana-image-renderer
      tag: v5.12.10
      sha: "cf36a94431662540a72d2058a43e0cbf72638334475d8216a25a77526a627be7"

    # Chromium-based rendering is bursty; keep a small baseline request and a
    # bounded limit so the renderer is schedulable without starving the node.
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 2Gi

    # The chart's default ingress policy only admits Grafana pods. Prometheus
    # runs in the monitoring namespace, so allow it to scrape port 8081.
    networkPolicy:
      limitIngress: true
      extraIngressSelectors:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              app.kubernetes.io/instance: prometheus

    # Configure deployment of ServiceMonitor for the image renderer.
    serviceMonitor:
      # Enable service monitor for image renderer.
      enabled: true
      labels:
        metrics.uplink.io/monitor: prometheus
      # Keep scraping once a minute, but allow a slow /metrics response longer
      # than the 30s default that the live target was timing out at.
      interval: 60s
      scrapeTimeout: 45s

  grafana.ini:
    server:
      domain: grafana.infra.rwx.im
      root_url: https://%(domain)s

    users:
      auto_assign_org_id: 2

  persistence:
    enabled: false

  plugins:
    - quickwit-quickwit-datasource

  # -- Set the number of replicas to deploy.
  replicas: 2

  # Configure deployment of ServiceMonitor.
  serviceMonitor:
    # Enable deployment of ServiceMonitor.
    enabled: true
    labels:
      metrics.uplink.io/monitor: prometheus

  sidecar:
    # -- Enable sidecar that monitors for dashboards from ConfigMaps
    dashboards:
      enabled: true
      # -- The label to watch for
      label: "grafana.com/dashboard"
      # -- The value to match
      labelValue: "true"
      # -- Only monitor ConfigMaps
      resource: configmap

certificate:
  # -- Create the Certificate resource.
  enabled: true
  # -- Override the name of the certificate
  name: grafana.infra.rwx.im
  # -- The domain name
  commonName: grafana.infra.rwx.im
  # -- Reference to the certificate issuer
  issuer:
    kind: ClusterIssuer
    name: letsencrypt-production
  # -- Override the name of the secret that cert-manager will use.
  secretName: ""

ingressRoute:
  enabled: true
  hostname: grafana.infra.rwx.im
  tls:
    secretName: grafana.infra.rwx.im-tls

sealedSecret:
  # -- Create the production SealedSecrets (admin credentials and environment).
  # Disable in environments without the production sealed-secrets key, such as
  # the kind e2e cluster, where Grafana generates its own admin credentials.
  enabled: true

# -- E2E-only PostSync probes. Enabled by values-kind.yaml in the kind e2e
# environment; never enabled in production.
e2e:
  enabled: false
  probeNamespace: monitoring
  probeImage: ""
