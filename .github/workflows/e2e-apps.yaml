name: Argo CD app e2e

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:
    inputs:
      app:
        description: "App from hack/e2e/apps.yaml"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-apps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  KUBECTL_VERSION: "v1.37.1"

jobs:
  changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_apps: ${{ steps.detect.outputs.has_apps }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install yq
        run: |
          ./hack/ci/install-tools.sh "${RUNNER_TEMP}/ci-bin" yq
          echo "${RUNNER_TEMP}/ci-bin" >>"${GITHUB_PATH}"
      - name: Detect changed applications
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          INPUT_APP: ${{ inputs.app }}
        run: ./hack/e2e/list-changed.sh

  e2e:
    name: App ${{ matrix.app }}
    needs: changes
    if: needs.changes.outputs.has_apps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: ${{ env.KUBECTL_VERSION }}
      - name: Install kind and yq
        run: |
          ./hack/ci/install-tools.sh "${RUNNER_TEMP}/ci-bin" kind yq
          echo "${RUNNER_TEMP}/ci-bin" >>"${GITHUB_PATH}"
      - name: Test Argo CD deployment
        env:
          APP: ${{ matrix.app }}
        run: ./hack/e2e/run-app.sh "${APP}"
