name: Astrarium e2e

# Astrarium e2e. Pull requests and pushes select apps from the diff; a manual
# dispatch runs the whole suite or one app. The workflow downloads the pinned
# release from `.github/astrarium-version`.
#
# Source changes build Astrarium once and share the binary through an artifact;
# app changes use the pinned release. Follow-ups:
# - pass previous-run results with `--previous-results` and grant `actions:
#   read` for that lookup;
# - gate the full suite on an `e2e/full` label, with the smoke set as default.

on:
  pull_request:
    paths-ignore:
    - "**.md"
    - ".github/ISSUE_TEMPLATE/**"
  push:
    branches: [main]
    paths-ignore:
    - "**.md"
    - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:
    inputs:
      app:
        description: "Optional app name; leave empty to run the full suite"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: astrarium-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect source changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      source: ${{ steps.detect.outputs.source }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Detect Astrarium source changes
      id: detect
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: |
        set -euo pipefail
        source=false
        if [[ "${EVENT_NAME}" != "workflow_dispatch" &&
          -n "${BASE_SHA}" && ! "${BASE_SHA}" =~ ^0+$ ]]; then
          if git diff --name-only "${BASE_SHA}" HEAD |
            grep -qE '^(astrarium\.toml$|astrium/(crates/|Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$|rustfmt\.toml$))'; then
            source=true
          fi
        fi
        echo "source=${source}" >>"${GITHUB_OUTPUT}"

  build:
    name: Build Astrarium
    needs: changes
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Rust
      if: needs.changes.outputs.source == 'true'
      run: |
        set -euo pipefail
        if ! rustup toolchain list | grep -q '^1.100.0'; then
          rustup toolchain install 1.100.0 --profile minimal
        fi
        rustup default 1.100.0
    - name: Cache Cargo and target
      if: needs.changes.outputs.source == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          astrium/target
        key: ${{ runner.os }}-astrarium-e2e-${{ hashFiles('astrium/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-astrarium-e2e-
    - name: Build release binary
      if: needs.changes.outputs.source == 'true'
      timeout-minutes: 12
      run: cargo build --locked --release --manifest-path astrium/Cargo.toml
    - name: Upload binary
      if: needs.changes.outputs.source == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: astrarium-linux
        path: astrium/target/release/astrarium
        if-no-files-found: error
        retention-days: 1

  plan:
    name: Plan matrix
    needs: [changes, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_apps: ${{ steps.plan.outputs.has_apps }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Read Astrarium version
      id: version
      run: |
        set -euo pipefail
        echo "version=$(tr -d '[:space:]' < .github/astrarium-version)" >>"${GITHUB_OUTPUT}"
    - name: Download built Astrarium
      if: needs.changes.outputs.source == 'true'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: astrarium-linux
        path: ${{ runner.temp }}/astrarium-bin
    - name: Install built Astrarium
      if: needs.changes.outputs.source == 'true'
      run: |
        set -euo pipefail
        mkdir -p "${HOME}/.local/bin"
        install -m 0755 "${RUNNER_TEMP}/astrarium-bin/astrarium" "${HOME}/.local/bin/astrarium"
        echo "${HOME}/.local/bin" >>"${GITHUB_PATH}"
    - name: Set up released Astrarium
      if: needs.changes.outputs.source != 'true'
      uses: ./.github/actions/setup-astrarium # zizmor: ignore[self-repository]
      with:
        version: ${{ steps.version.outputs.version }}
        token: ${{ github.token }}
    - name: Plan selected apps
      id: plan
      env:
        INPUT_APP: ${{ inputs.app }}
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: |
        set -euo pipefail
        args=(--json)
        if [[ -n "${INPUT_APP}" ]]; then
          args+=(--app "${INPUT_APP}")
        elif [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
          args+=(--all)
        elif [[ -n "${BASE_SHA}" && ! "${BASE_SHA}" =~ ^0+$ ]]; then
          args+=(--base "${BASE_SHA}")
        fi
        plan_json="$(astrarium plan "${args[@]}")"
        matrix="$(jq -c '.matrix' <<<"${plan_json}")"
        count="$(jq -r '.include | length' <<<"${matrix}")"
        echo "matrix=${matrix}" >>"${GITHUB_OUTPUT}"
        if [[ "${count}" -gt 0 ]]; then
          echo "has_apps=true" >>"${GITHUB_OUTPUT}"
        else
          echo "has_apps=false" >>"${GITHUB_OUTPUT}"
        fi
        {
          echo "## Astrarium e2e plan"
          echo
          echo "Selected ${count} app(s)."
          echo
          echo '```json'
          echo "${matrix}"
          echo '```'
        } >>"${GITHUB_STEP_SUMMARY}"

  run:
    name: App ${{ matrix.app }}
    needs: [changes, build, plan]
    # Repository secrets are not available to fork pull requests. Run this
    # authenticated job only for branches in this repository.
    if: >-
      needs.plan.outputs.has_apps == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      REGISTRY: registry.rwx.im
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
        persist-credentials: false
    - name: Read Astrarium version
      id: version
      run: |
        set -euo pipefail
        echo "version=$(tr -d '[:space:]' < .github/astrarium-version)" >>"${GITHUB_OUTPUT}"
    - name: Download built Astrarium
      if: needs.changes.outputs.source == 'true'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: astrarium-linux
        path: ${{ runner.temp }}/astrarium-bin
    - name: Install built Astrarium
      if: needs.changes.outputs.source == 'true'
      run: |
        set -euo pipefail
        mkdir -p "${HOME}/.local/bin"
        install -m 0755 "${RUNNER_TEMP}/astrarium-bin/astrarium" "${HOME}/.local/bin/astrarium"
        echo "${HOME}/.local/bin" >>"${GITHUB_PATH}"
    - name: Set up released Astrarium
      if: needs.changes.outputs.source != 'true'
      uses: ./.github/actions/setup-astrarium # zizmor: ignore[self-repository]
      with:
        version: ${{ steps.version.outputs.version }}
        token: ${{ github.token }}
    - name: Install Helm
      env:
        HELM_VERSION: v4.3.0
        HELM_SHA256: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb
      run: |
        set -euo pipefail
        tmp="$(mktemp -d)"
        trap 'rm -rf "${tmp}"' EXIT
        archive="helm-${HELM_VERSION}-linux-amd64.tar.gz"
        curl -fsSL "https://get.helm.sh/${archive}" -o "${tmp}/${archive}"
        printf '%s  %s\n' "${HELM_SHA256}" "${tmp}/${archive}" |
          sha256sum --check --status
        tar -xzf "${tmp}/${archive}" -C "${tmp}"
        install -m 0755 "${tmp}/linux-amd64/helm" "${HOME}/.local/bin/helm"
        helm version --short
    - name: Install kind, kustomize and yq
      run: ./hack/ci/install-tools.sh "${HOME}/.local/bin" kind kustomize yq
    - name: Log in to the registry
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_PASSWORD }}
    - name: Validate CI images
      env:
        APP: ${{ matrix.app }}
      run: ./hack/ci/validate-ci-images.sh "${APP}"
    - name: Prepare CI images
      run: ./hack/ci/prepare-ci-images.sh
    - name: Start local services
      # Each matrix job has its own runner, so the fixed compose ports do not
      # collide across apps.
      timeout-minutes: 10
      run: docker compose -f astrium/compose.yaml up -d
    - name: Wait for Jaeger
      timeout-minutes: 5
      run: |
        set -euo pipefail
        for _ in $(seq 1 30); do
          if curl -fsS http://localhost:16686/ >/dev/null; then
            exit 0
          fi
          sleep 2
        done
        echo "::error::Jaeger did not become ready"
        docker compose -f astrium/compose.yaml logs
        exit 1
    - name: Check tools
      run: |
        set -euo pipefail
        kind version
        kustomize version
        helm version --short
        astrarium doctor --require-config
    - name: Run Astrarium
      timeout-minutes: 20
      env:
        APP: ${{ matrix.app }}
        ASTRARIUM_REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
        ASTRARIUM_REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      run: |
        set -euo pipefail
        astrarium run --app "${APP}" --fast-fail --keep-cluster \
          --trace-file "diagnostics/astrarium-trace.json"
    - name: Run the upgrade test
      timeout-minutes: 30
      env:
        APP: ${{ matrix.app }}
      run: |
        set -euo pipefail
        astrarium upgrade --app "${APP}" --reuse-cluster --no-deploy \
          --trace-file "diagnostics/astrarium-upgrade-trace.json"
    - name: Upload trace file
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: astrarium-${{ matrix.app }}-trace
        path: diagnostics/astrarium-trace.json
        if-no-files-found: warn
        retention-days: 7
    - name: Upload upgrade trace file
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: astrarium-${{ matrix.app }}-upgrade-trace
        path: diagnostics/astrarium-upgrade-trace.json
        if-no-files-found: warn
        retention-days: 7
    - name: Collect kind logs
      if: failure()
      timeout-minutes: 5
      run: |
        set -euo pipefail
        mkdir -p diagnostics
        while IFS= read -r cluster; do
          kind export logs "diagnostics/${cluster}" --name "${cluster}" || true
        done < <(kind get clusters | grep -E '^astrarium(-|$)' || true)
    - name: Upload diagnostics
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: astrarium-${{ matrix.app }}-diagnostics
        path: diagnostics/
        if-no-files-found: ignore
        retention-days: 7
    - name: Write summary
      if: always()
      env:
        APP: ${{ matrix.app }}
        JOB_STATUS: ${{ job.status }}
      run: |
        set -euo pipefail
        {
          echo "## Astrarium e2e: ${APP}"
          echo
          echo "Result: **${JOB_STATUS}**."
        } >>"${GITHUB_STEP_SUMMARY}"
