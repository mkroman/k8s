name: Astrarium e2e

# M4 skeleton. `astrarium run` is not implemented yet, so this workflow is
# workflow_dispatch-only: pull requests must not fail on a command that is still
# being built. Enable the pull_request/push triggers below once `run` lands.
#
# Intended triggers:
#   pull_request:
#     paths-ignore:
#     - "**.md"
#     - ".github/ISSUE_TEMPLATE/**"
#   push:
#     branches: [main]
#     paths-ignore:
#     - "**.md"
#     - ".github/ISSUE_TEMPLATE/**"
#
# The plan job selects apps from the diff (`astrarium plan --json`) and emits a
# GitHub Actions matrix of the form {"include":[{"app":"..."}]}. A manual
# dispatch runs the whole suite, or one app when the optional `app` input is
# set.
#
# M4 follow-ups once `run` lands:
# - build Astrarium from source when `astrium/**` changes and reuse the release
#   binary otherwise;
# - pass the PR base to `astrarium plan --base` and the previous-run results to
#   `astrarium plan --previous-results`, and grant `actions: read` for that
#   lookup;
# - gate the full suite on an `e2e/full` label, with the smoke set as default.

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Optional app name; leave empty to run the full suite"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: astrarium-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_apps: ${{ steps.plan.outputs.has_apps }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Read Astrarium version
      id: version
      run: |
        set -euo pipefail
        echo "version=$(tr -d '[:space:]' < .github/astrarium-version)" >>"${GITHUB_OUTPUT}"
    - name: Set up Astrarium
      uses: ./.github/actions/setup-astrarium # zizmor: ignore[self-repository]
      with:
        version: ${{ steps.version.outputs.version }}
        token: ${{ github.token }}
    - name: Plan selected apps
      id: plan
      env:
        INPUT_APP: ${{ inputs.app }}
      run: |
        set -euo pipefail
        args=(--json)
        if [[ -n "${INPUT_APP}" ]]; then
          args+=(--app "${INPUT_APP}")
        else
          args+=(--all)
        fi
        plan_json="$(astrarium plan "${args[@]}")"
        matrix="$(jq -c '.matrix' <<<"${plan_json}")"
        count="$(jq -r '.include | length' <<<"${matrix}")"
        echo "matrix=${matrix}" >>"${GITHUB_OUTPUT}"
        if [[ "${count}" -gt 0 ]]; then
          echo "has_apps=true" >>"${GITHUB_OUTPUT}"
        else
          echo "has_apps=false" >>"${GITHUB_OUTPUT}"
        fi
        {
          echo "## Astrarium e2e plan"
          echo
          echo "Selected ${count} app(s)."
          echo
          echo '```json'
          echo "${matrix}"
          echo '```'
        } >>"${GITHUB_STEP_SUMMARY}"

  run:
    name: App ${{ matrix.app }}
    needs: plan
    if: needs.plan.outputs.has_apps == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
        persist-credentials: false
    - name: Read Astrarium version
      id: version
      run: |
        set -euo pipefail
        echo "version=$(tr -d '[:space:]' < .github/astrarium-version)" >>"${GITHUB_OUTPUT}"
    - name: Set up Astrarium
      uses: ./.github/actions/setup-astrarium # zizmor: ignore[self-repository]
      with:
        version: ${{ steps.version.outputs.version }}
        token: ${{ github.token }}
    - name: Install Helm
      env:
        HELM_VERSION: v4.3.0
        HELM_SHA256: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb
      run: |
        set -euo pipefail
        tmp="$(mktemp -d)"
        trap 'rm -rf "${tmp}"' EXIT
        archive="helm-${HELM_VERSION}-linux-amd64.tar.gz"
        curl -fsSL "https://get.helm.sh/${archive}" -o "${tmp}/${archive}"
        printf '%s  %s\n' "${HELM_SHA256}" "${tmp}/${archive}" |
          sha256sum --check --status
        tar -xzf "${tmp}/${archive}" -C "${tmp}"
        install -m 0755 "${tmp}/linux-amd64/helm" "${HOME}/.local/bin/helm"
        helm version --short
    - name: Install kind and kustomize
      run: ./hack/ci/install-tools.sh "${HOME}/.local/bin" kind kustomize
    - name: Start local services
      # Each matrix job has its own runner, so the fixed compose ports do not
      # collide across apps.
      timeout-minutes: 10
      run: docker compose -f astrium/compose.yaml up -d
    - name: Wait for Jaeger
      timeout-minutes: 5
      run: |
        set -euo pipefail
        for _ in $(seq 1 30); do
          if curl -fsS http://localhost:16686/ >/dev/null; then
            exit 0
          fi
          sleep 2
        done
        echo "::error::Jaeger did not become ready"
        docker compose -f astrium/compose.yaml logs
        exit 1
    - name: Check tools
      run: |
        set -euo pipefail
        kind version
        kustomize version
        helm version --short
        astrarium doctor --require-config
    - name: Run Astrarium
      timeout-minutes: 20
      env:
        APP: ${{ matrix.app }}
      run: astrarium run --app "${APP}" --fast-fail
    - name: Collect kind logs
      if: failure()
      timeout-minutes: 5
      run: |
        set -euo pipefail
        mkdir -p diagnostics
        while IFS= read -r cluster; do
          kind export logs "diagnostics/${cluster}" --name "${cluster}" || true
        done < <(kind get clusters | grep '^astrarium-' || true)
    - name: Upload diagnostics
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: astrarium-${{ matrix.app }}-diagnostics
        path: |
          diagnostics/
          .astrium/
        if-no-files-found: ignore
        retention-days: 7
    - name: Write summary
      if: always()
      env:
        APP: ${{ matrix.app }}
        JOB_STATUS: ${{ job.status }}
      run: |
        set -euo pipefail
        {
          echo "## Astrarium e2e: ${APP}"
          echo
          echo "Result: **${JOB_STATUS}**."
        } >>"${GITHUB_STEP_SUMMARY}"
