name: Container images

on:
  pull_request:
    paths:
      - images/ser2net/**
      - .github/workflows/container-images.yaml
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - images/ser2net/**
      - .github/workflows/container-images.yaml
  workflow_dispatch:
  schedule:
    # Rebuild weekly so base-image and Debian package security updates are
    # picked up even when this repository does not change.
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: container-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ser2net
  SER2NET_VERSION: "4.6.4-1"

jobs:
  build:
    name: Build ser2net
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=${{ env.SER2NET_VERSION }},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/ser2net
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SER2NET_VERSION=${{ env.SER2NET_VERSION }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign image
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  pin-digest:
    name: Pin ser2net image digest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Resolve image digest
        id: digest
        run: |
          digest="$(docker buildx imagetools inspect \
            "${IMAGE}:sha-${GITHUB_SHA}" --format '{{.Manifest.Digest}}')"
          echo "digest=${digest}" >>"${GITHUB_OUTPUT}"

      - name: Update chart digest
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          path = pathlib.Path("ser2net/values.yaml")
          text = path.read_text()
          digest = os.environ["DIGEST"]
          text = re.sub(r"(?m)^  digest: .*$", f'  digest: "{digest}"', text, count=1)
          path.write_text(text)
          PY

      - name: Open digest pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ github.token }}
          add-paths: ser2net/values.yaml
          branch: container-image/ser2net-digest
          delete-branch: true
          commit-message: "ser2net: pin image digest"
          title: "ser2net: pin image digest"
          body: |
            Pin the ser2net chart to the digest of the latest published image
            (`${{ steps.digest.outputs.digest }}`).

            The image is signed and has SBOM/provenance attestations. Verify it
            with the identity documented in `ser2net/README.md`.
