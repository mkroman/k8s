name: Lint automation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          ./hack/ci/install-tools.sh "${RUNNER_TEMP}/ci-bin" actionlint shellcheck
          echo "${RUNNER_TEMP}/ci-bin" >>"${GITHUB_PATH}"
      - name: Lint workflows
        run: actionlint

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck
        run: |
          ./hack/ci/install-tools.sh "${RUNNER_TEMP}/ci-bin" shellcheck
          echo "${RUNNER_TEMP}/ci-bin" >>"${GITHUB_PATH}"
      - name: Lint scripts
        run: shellcheck hack/ci/*.sh hack/e2e/*.sh

  renovate:
    name: renovate config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      # Pinned to a full version and digest; the github-actions manager updates
      # both when a new Renovate release is available.
      image: ghcr.io/renovatebot/renovate:44.191.0@sha256:3e9be1a29672f4860eea6818e68ef01c1b8fdea984e09c9c664eeaf48b7e150c
      # GitHub-hosted runners mount the workspace as 1001:127; the Renovate
      # image runs as 12021. Match the permissions used by the official
      # renovatebot/github-action CI.
      options: -u 1001:0 --group-add 1000 --group-add 12021 --group-add 127
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate configuration
        run: renovate-config-validator --no-global --strict renovate.json

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit workflows
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          inputs: .github/workflows
