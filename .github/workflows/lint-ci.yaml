name: Lint automation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        # GitHub-hosted ubuntu-latest already has $HOME/.local/bin on PATH.
        run: ./hack/ci/install-tools.sh "${HOME}/.local/bin" actionlint shellcheck
      - name: Lint workflows
        run: actionlint

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck
        # GitHub-hosted ubuntu-latest already has $HOME/.local/bin on PATH.
        run: ./hack/ci/install-tools.sh "${HOME}/.local/bin" shellcheck
      - name: Lint scripts
        run: shellcheck hack/ci/*.sh

  renovate:
    name: renovate config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REGISTRY: registry.rwx.im
      # Pinned to a full version and digest; the github-actions manager updates
      # both when a new Renovate release is available.
      RENOVATE_IMAGE: ghcr.io/renovatebot/renovate:44.257.9
      RENOVATE_DIGEST: sha256:d6b65ff3562dd499240b23d34ef806ec7e5fd2675e4236a027dfb36774f2aa75
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to the registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Pull the Renovate image through the registry proxy
        run: |
          set -euo pipefail
          docker pull "${REGISTRY}/${RENOVATE_IMAGE}@${RENOVATE_DIGEST}"
          docker tag "${REGISTRY}/${RENOVATE_IMAGE}@${RENOVATE_DIGEST}" "${RENOVATE_IMAGE}"
      - name: Validate configuration
        run: |
          set -euo pipefail
          # GitHub-hosted runners mount the workspace as 1001:127; the Renovate
          # image runs as 12021. Match the permissions used by the official
          # renovatebot/github-action CI.
          docker run --rm \
            --entrypoint renovate-config-validator \
            -v "${PWD}:/workspace" -w /workspace \
            -u 1001:0 --group-add 1000 --group-add 12021 --group-add 127 \
            "${RENOVATE_IMAGE}" \
            --no-global --strict renovate.json

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit workflows
        uses: zizmorcore/zizmor-action@bd12b495c90993a4301c73398142281a61499af3 # v0.9.0
        with:
          advanced-security: false
          inputs: .github/workflows
