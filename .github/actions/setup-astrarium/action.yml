name: Setup Astrarium
description: Download, verify and cache a pinned Astrarium release binary.

inputs:
  version:
    description: Astrarium version without the astrarium-v tag prefix.
    required: true
  token:
    description: GitHub token used to download the release assets.
    required: false
    default: ""

outputs:
  cache-hit:
    description: Whether the Astrarium binary was restored from the actions cache.
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
  - name: Resolve target
    id: target
    shell: bash
    run: |
      set -euo pipefail
      case "$(uname -m)" in
        x86_64|amd64)
          target=x86_64-unknown-linux-gnu
          ;;
        aarch64|arm64)
          target=aarch64-unknown-linux-gnu
          ;;
        *)
          echo "::error::Astrarium does not publish a release for $(uname -m) yet"
          exit 1
          ;;
      esac
      echo "target=${target}" >>"${GITHUB_OUTPUT}"
  - name: Cache Astrarium
    id: cache
    uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
    with:
      path: ~/.local/bin/astrarium
      key: astrarium-${{ inputs.version }}-${{ runner.os }}-${{ steps.target.outputs.target }}
  - name: Install Astrarium
    if: steps.cache.outputs.cache-hit != 'true'
    shell: bash
    env:
      GH_TOKEN: ${{ inputs.token || github.token }}
      REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
      TARGET: ${{ steps.target.outputs.target }}
    run: |
      set -euo pipefail
      tag="astrarium-v${VERSION}"
      asset="astrarium-${VERSION}-${TARGET}.tar.gz"
      tmp="$(mktemp -d)"
      trap 'rm -rf "${tmp}"' EXIT
      gh release download "${tag}" \
        --repo "${REPO}" \
        --pattern "${asset}" \
        --pattern "SHA256SUMS" \
        --dir "${tmp}"
      expected="$(awk -v asset="${asset}" '$2 == asset { print $1 }' "${tmp}/SHA256SUMS")"
      if [[ ! "${expected}" =~ ^[a-f0-9]{64}$ ]]; then
        echo "::error::SHA256SUMS has no checksum for ${asset}"
        exit 1
      fi
      if ! printf '%s  %s\n' "${expected}" "${tmp}/${asset}" | sha256sum --check --status; then
        echo "::error::checksum verification failed for ${asset}"
        exit 1
      fi
      tar -xzf "${tmp}/${asset}" -C "${tmp}"
      mkdir -p "${HOME}/.local/bin"
      install -m 0755 \
        "${tmp}/astrarium-${VERSION}-${TARGET}/astrarium" \
        "${HOME}/.local/bin/astrarium"
  - name: Verify Astrarium
    shell: bash
    env:
      VERSION: ${{ inputs.version }}
    run: | # zizmor: ignore[github-env]
      set -euo pipefail
      binary="${HOME}/.local/bin/astrarium"
      chmod +x "${binary}"
      installed="$("${binary}" --version | awk '{print $2}')"
      if [[ "${installed}" != "${VERSION}" ]]; then
        echo "::error::expected Astrarium ${VERSION}, got ${installed}"
        exit 1
      fi
      echo "${HOME}/.local/bin" >>"${GITHUB_PATH}" # zizmor: ignore[github-env]
      echo "Astrarium ${installed} is ready."
