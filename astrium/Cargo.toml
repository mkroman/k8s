[workspace]
members = [
  "crates/astrarium",
  "crates/astrarium-core",
  "crates/astrarium-test-support",
]
resolver = "3"

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
authors = ["mkroman <173308+mkroman@users.noreply.github.com>"]
repository = "https://github.com/mkroman/k8s"
homepage = "https://github.com/mkroman/k8s/tree/main/astrium"
description = "Clockwork test orchestration for Kubernetes GitOps"
keywords = ["kubernetes", "gitops", "testing", "argo-cd", "kind"]
categories = ["development-tools::testing"]

[workspace.dependencies]
astrarium-core = { version = "0.1.2", path = "crates/astrarium-core" }
astrarium-test-support = { version = "0.1.2", path = "crates/astrarium-test-support" }

axum = "0.8.9"
base64 = "0.22.1"
bollard = "0.21.1"
clap = { version = "4.6.10", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6.12"
futures = "0.3.34"
gix = { version = "0.91.0", default-features = false, features = ["basic", "sha1"] }
http = "1.5.0"
jiff = { version = "1.0.3", features = ["serde"] }
k8s-openapi = { version = "0.29.0", features = ["v1_37"] }
local-ip-address = "0.6.13"
kube = { version = "5.2.0", default-features = false, features = ["client", "config", "runtime", "derive", "rustls-tls", "ring", "ws"] }
miette = { version = "7.6.0", features = ["fancy"] }
opentelemetry = "0.33.1"
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "rt-tokio"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2"] }
schemars = "1.2.3"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
toml = { version = "1.2.3", features = ["preserve_order"] }
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.34.0", default-features = false }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }
which = "8.0.6"
yaml_serde = "0.10.7"

# Dev dependencies shared by the workspace.
assert_cmd = "2.2.2"
insta = { version = "1.49.0", features = ["json", "yaml"] }
predicates = "3.1.4"
serial_test = "4.0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
mod_module_files = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
format_push_string = "allow"

[workspace.lints.cargo]
unused_dependencies = "warn"
