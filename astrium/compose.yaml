# Local services for Astrarium.
#
#   docker compose -f astrium/compose.yaml up -d
#
# Jaeger receives OTLP/gRPC on 4317 and OTLP/HTTP on 4318. The UI is on
# http://localhost:16686.
#
# Astrarium configures containerd to pull through registry.rwx.im directly.
# The host-side images (`kindest/node` and Jaeger) are pulled through the same
# registry and retagged by hack/ci/prepare-ci-images.sh before kind and compose
# run.
name: astrarium

services:
  jaeger:
    image: jaegertracing/jaeger:2.23.0@sha256:3823829974ccfc2485d2e48b165579091f32295022ae80ca49704e2f4834116e
    restart: unless-stopped
    ports:
    - "16686:16686"
    - "4317:4317"
    - "4318:4318"
    environment:
      # Jaeger v2 is an OTel Collector distribution. Keep the all-in-one
      # defaults (OTLP receivers and in-memory storage) and disable its own
      # self-telemetry exporter so a loop cannot form.
      OTEL_TRACES_EXPORTER: none
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
