{{- range .Values.newApplications }}
{{- $appName := .name }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ required "A valid application .name is required" .name | quote }}
  namespace: {{ $.Values.argocdNamespace }}
  {{- /* Child Application health is scoped on purpose: platform-gate apps
         (`ignoreHealthcheck: false`) propagate health so the root sync wave
         waits for them, while every other app is ignored by its parent so a
         single degraded workload neither stalls the catalogue nor turns the
         root Application Degraded. Workload health is monitored through
         Prometheus alerts instead. */}}
  {{- $ignoreHealthcheck := true }}
  {{- if hasKey . "ignoreHealthcheck" }}
    {{- $ignoreHealthcheck = .ignoreHealthcheck }}
  {{- end }}
  {{- $annotations := dict }}
  {{- if $ignoreHealthcheck }}
    {{- $_ := set $annotations "argocd.argoproj.io/ignore-healthcheck" "true" }}
  {{- end }}
  {{- with .annotations }}
    {{- $annotations = mergeOverwrite $annotations . }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if hasKey . "finalizers" }}
  finalizers:
    {{- .finalizers | default list | toYaml | nindent 4 }}
  {{- else if ne .useDefaultFinalizers false }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  {{- end }}
spec:
  project: {{ .project | default "default" | quote }}

  destination:
  {{- with .destination }}
    namespace: {{ .namespace | default $appName | quote }}
    {{- if .server }}
    server: {{ .server | quote }}
    {{- else if .name }}
    name: {{ .name | quote }}
    {{- else }}
    name: "in-cluster"
    {{- end }}
  {{- else }}
    namespace: {{ $appName | quote }}
    name: "in-cluster"
  {{- end }}

  {{/* Support both `sources` and `source` */}}
  {{- if .sources }}
  sources:
    {{- range .sources }}
    - repoURL: {{ required (printf "repoURL is required in sources for application %s" $appName) .repoURL | quote }}
      {{- if not .targetRevision }}
      {{- if not .chart }}
      targetRevision: "HEAD"
      {{- end }}
      {{- end }}
      {{- if not (or .path .chart .ref) }}
      path: "."
      {{- end }}
      {{- $rest := omit . "repoURL" }}
      {{- if $rest }}
      {{- toYaml $rest | nindent 6 }}
      {{- end }}
    {{- end }}
  {{- else if .source }}
  source:
    repoURL: {{ required (printf "repoURL is required in source for application %s" $appName) .source.repoURL | quote }}
    {{- if not .source.targetRevision }}
    {{- if not .source.chart }}
    targetRevision: "HEAD"
    {{- end }}
    {{- end }}
    {{- if not (or .source.path .source.chart) }}
    path: "."
    {{- end }}
    {{- $rest := omit .source "repoURL" }}
    {{- if $rest }}
    {{- toYaml $rest | nindent 4 }}
    {{- end }}
  {{- else }}
  {{- fail (printf "Either 'source' or 'sources' must be provided for application %s" $appName) }}
  {{- end }}

  {{- /* Every application gets a default sync policy; an app's own
         `syncPolicy` fields override the defaults instead of replacing them,
         so no application silently loses the retry block:
           - `automated` is taken verbatim from the app when present
             (`automated: {}` therefore still means "auto-sync, no prune,
             no self-heal").
           - `retry` is deep-merged (`retry: {limit: 0}` disables retries).
           - `syncOptions` are concatenated after the defaults.
           - any other `syncPolicy` field (e.g. `managedNamespaceMetadata`)
             is merged as-is.
         `useDefaultSyncPolicy: false` renders `syncPolicy` verbatim without
         any defaults. */}}
  {{- $automated := dict "prune" true "selfHeal" true }}
  {{- $retry := dict "limit" 10 "refresh" true "backoff" (dict "duration" "5s" "factor" 2 "maxDuration" "5m") }}
  {{- $syncOptions := list "ApplyOutOfSyncOnly=true" "SkipDryRunOnMissingResource=true" }}
  {{- $syncPolicyExtra := dict }}
  {{- if hasKey . "syncPolicy" }}
    {{- with .syncPolicy }}
      {{- if hasKey . "automated" }}
        {{- $automated = .automated }}
      {{- end }}
      {{- if hasKey . "retry" }}
        {{- $retry = mergeOverwrite $retry .retry }}
      {{- end }}
      {{- if hasKey . "syncOptions" }}
        {{- $syncOptions = concat $syncOptions .syncOptions | uniq }}
      {{- end }}
      {{- $syncPolicyExtra = omit . "automated" "retry" "syncOptions" }}
    {{- end }}
  {{- end }}
  {{- if ne .useDefaultSyncPolicy false }}
  syncPolicy:
    automated:
      {{- toYaml $automated | nindent 6 }}
    retry:
      {{- toYaml $retry | nindent 6 }}
    syncOptions:
      {{- range $syncOptions }}
      - {{ . | quote }}
      {{- end }}
    {{- with $syncPolicyExtra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- else if hasKey . "syncPolicy" }}
  syncPolicy:
    {{- toYaml .syncPolicy | nindent 4 }}
  {{- end }}
{{- end }}
