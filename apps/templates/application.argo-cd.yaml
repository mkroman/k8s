{{- if .Values.argoCDApplication.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-cd
  namespace: {{ .Values.argocdNamespace }}
  annotations:
    # Argo CD self-management is not part of the platform gate; workload
    # health is alerted on directly. Keeping it ignored stops a repo-server
    # restart from turning the root catalogue Degraded.
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  destination:
    namespace: {{ .Values.argocdNamespace }}
    server: {{ .Values.spec.destination.server }}
  project: production
  source:
    path: argo-cd/overlays/production
    repoURL: {{ .Values.spec.source.repoURL }}
    targetRevision: {{ .Values.spec.source.targetRevision }}
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 10
      refresh: true
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 5m
    syncOptions:
    - ApplyOutOfSyncOnly=true
    - ServerSideApply=true
    - ClientSideApplyMigration=false
{{- end }}
