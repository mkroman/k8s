repository: https://github.com/mkroman/k8s.git

argocdNamespace: argocd

# -- Render the Application that manages Argo CD itself.
argoCDApplication:
  enabled: true

spec:
  destination:
    server: https://kubernetes.default.svc
  source:
    repoURL: https://github.com/mkroman/k8s
    targetRevision: HEAD

# -- List of Argo CD projects.
projects:
  - name: agentgateway
    description: "Agentgateway control plane for AI, MCP and A2A traffic (Kubernetes Gateway API)"
    destinations:
      - namespace: agentgateway-system
    sourceRepos:
      - https://github.com/mkroman/k8s
    clusterResourceWhitelist:
      - group: apiextensions.k8s.io
        kind: CustomResourceDefinition
      - group: admissionregistration.k8s.io
        kind: ValidatingAdmissionPolicy
      - group: admissionregistration.k8s.io
        kind: ValidatingAdmissionPolicyBinding
      - group: gateway.networking.k8s.io
        kind: GatewayClass
      - group: rbac.authorization.k8s.io
        kind: ClusterRole
      - group: rbac.authorization.k8s.io
        kind: ClusterRoleBinding

  - name: cert-manager
    description: "Automated TLS certificate management via ACME"
    destinations:
      - namespace: cert-manager
      - namespace: kube-system
    sourceRepos:
      - https://github.com/mkroman/k8s
    clusterResourceWhitelist:
      - kind: ClusterRole
        group: rbac.authorization.k8s.io
      - kind: ClusterRoleBinding
        group: rbac.authorization.k8s.io
      - kind: MutatingWebhookConfiguration
        group: admissionregistration.k8s.io
      - kind: ValidatingWebhookConfiguration
        group: admissionregistration.k8s.io
      - kind: CustomResourceDefinition
        group: apiextensions.k8s.io
      - kind: ClusterIssuer
        group: cert-manager.io

  - name: chadgpt
    description: "LLM-powered IRC bot"
    destinations:
      - namespace: chadgpt
    sourceRepos:
      - https://github.com/mkroman/k8s

  - name: chadgpt-magistr
    description: "Instance of chadgpt for the #magistr IRC channel"
    destinations:
      - namespace: chadgpt-magistr
    sourceRepos:
      - https://github.com/mkroman/k8s

  - name: cloudnative-pg
    description: "CloudNativePG operator for PostgreSQL clusters"
    destinations:
      - namespace: cnpg-system
    sourceRepos:
      - https://github.com/mkroman/k8s
    clusterResourceWhitelist:
      - kind: ClusterRole
        group: rbac.authorization.k8s.io
      - kind: ClusterRoleBinding
        group: rbac.authorization.k8s.io
      - kind: MutatingWebhookConfiguration
        group: admissionregistration.k8s.io
      - kind: ValidatingWebhookConfiguration
        group: admissionregistration.k8s.io
      - kind: CustomResourceDefinition
        group: apiextensions.k8s.io
      - kind: Namespace
        group: ""
        name: cnpg-system

  - name: longhorn
    description: "Longhorn distributed block storage"
    destinations:
      - namespace: longhorn-system
    sourceRepos:
      - https://github.com/mkroman/k8s
    clusterResourceWhitelist:
      - group: "apiextensions.k8s.io"
        kind: CustomResourceDefinition
      - group: "rbac.authorization.k8s.io"
        kind: ClusterRole
      - group: "rbac.authorization.k8s.io"
        kind: ClusterRoleBinding
      - group: "storage.k8s.io"
        kind: StorageClass
      - group: "storage.k8s.io"
        kind: CSIDriver
      - group: "storage.k8s.io"
        kind: CSINode
      - group: "admissionregistration.k8s.io"
        kind: MutatingWebhookConfiguration
      - group: "admissionregistration.k8s.io"
        kind: ValidatingWebhookConfiguration
      - group: "scheduling.k8s.io"
        kind: PriorityClass
      - group: ""
        kind: PersistentVolume
      # Allows Longhorn nodes/engines (often managed by CRDs) to be cluster-scoped if necessary
      - group: "longhorn.io"
        kind: "*"
    namespaceResourceBlacklist: []

  - name: magistr
    description: "magistr.dk IRC quote site"
    destinations:
      - namespace: magistr-prod
    sourceRepos:
      - https://github.com/mkroman/k8s
    # Opt out of the default namespace blacklist (which forbids NetworkPolicy,
    # ResourceQuota and LimitRange): the production chart enables an
    # ingress-only NetworkPolicy.
    namespaceResourceBlacklist: []

  - name: monitoring
    description: "Cluster monitoring stack (Prometheus, Thanos, Grafana)"
    destinations:
      - namespace: grafana
      - namespace: monitoring
    sourceRepos:
      - https://github.com/mkroman/k8s
    clusterResourceWhitelist:
      - group: rbac.authorization.k8s.io
        kind: ClusterRole
      - group: rbac.authorization.k8s.io
        kind: ClusterRoleBinding
    namespaceResourceBlacklist: []

  - name: mosquitto
    description: "Eclipse Mosquitto MQTT broker"
    destinations:
      - namespace: mosquitto
    sourceRepos:
      - https://github.com/mkroman/k8s
    namespaceResourceWhitelist:
      - group: ""
        kind: ConfigMap
      - group: ""
        kind: PersistentVolumeClaim
      - group: ""
        kind: Service
      - group: apps
        kind: Deployment
      - group: batch
        kind: Job
      - group: networking.k8s.io
        kind: NetworkPolicy
      # The production render includes the MQTT password as a SealedSecret.
      # A namespaceResourceWhitelist is exclusive, so an unlisted kind is
      # denied during sync even though the e2e overlay deletes this resource.
      - group: bitnami.com
        kind: SealedSecret

  - name: mumble
    description: "Mumble (Murmur) VoIP server"
    destinations:
      - namespace: rwx
    sourceRepos:
      - https://github.com/mkroman/k8s

  - name: mqtt2prometheus
    description: "Exports MQTT topic values as Prometheus metrics"
    destinations:
      - namespace: mqtt2prometheus
    sourceRepos:
      - https://github.com/mkroman/k8s

  - name: nats
    description: "NATS messaging system for data layer services"
    destinations:
      - namespace: nats
    sourceRepos:
      - https://github.com/mkroman/k8s

  - name: node-feature-discovery
    description: "Node Feature Discovery — hardware and OS feature labels for nodes"
    destinations:
      - namespace: node-feature-discovery
    sourceRepos:
      - https://github.com/mkroman/k8s
    clusterResourceWhitelist:
      - group: apiextensions.k8s.io
        kind: CustomResourceDefinition
      - group: nfd.k8s-sigs.io
        kind: NodeFeatureRule
      - group: rbac.authorization.k8s.io
        kind: ClusterRole
      - group: rbac.authorization.k8s.io
        kind: ClusterRoleBinding

  - name: open-webui
    description: "Self-hosted LLM chat interface (Open WebUI)"
    destinations:
      - namespace: rwx-openwebui-prod
    sourceRepos:
      - https://github.com/mkroman/k8s

  - name: prometheus-operator
    description: "Manages the deployment and lifecycle of the Prometheus Operator and its CRDs"
    destinations:
      - namespace: prometheus-operator
    sourceRepos:
      - https://github.com/mkroman/k8s
    clusterResourceWhitelist:
      - group: apiextensions.k8s.io
        kind: CustomResourceDefinition
      - group: rbac.authorization.k8s.io
        kind: ClusterRole
      - group: rbac.authorization.k8s.io
        kind: ClusterRoleBinding
      # The webhooks are needed for the admission and mutation webhooks
      - group: admissionregistration.k8s.io
        kind: ValidatingWebhookConfiguration
      - group: admissionregistration.k8s.io
        kind: MutatingWebhookConfiguration

  - name: quickwit
    description: "Quickwit search and analytics engine"
    destinations:
      - namespace: quickwit-prod
    sourceRepos:
      - https://github.com/mkroman/k8s

  - name: redis
    description: "Redis Sentinel high-availability deployment"
    destinations:
      - namespace: rwx-redis-prod
    sourceRepos:
      - https://github.com/mkroman/k8s
    namespaceResourceBlacklist:
      - group: ""
        kind: ResourceQuota
      - group: ""
        kind: LimitRange

  - name: renovate
    description: "Self-hosted Renovate (dependency update automation)"
    destinations:
      - namespace: renovate
    sourceRepos:
      - https://github.com/mkroman/k8s
    namespaceResourceBlacklist:
      - group: ""
        kind: ResourceQuota
      - group: ""
        kind: LimitRange

  - name: rwx
    description: "rwx.im domain resources (databases, certificates, services)"
    destinations:
      - namespace: rwx
    sourceRepos:
      - https://github.com/mkroman/k8s

  - name: sealed-secrets
    description: "Bitnami Sealed Secrets — encrypt secrets for GitOps"
    destinations:
      - namespace: kube-system
    sourceRepos:
      - https://github.com/mkroman/k8s
    clusterResourceWhitelist:
      - group: apiextensions.k8s.io
        kind: CustomResourceDefinition
      - group: rbac.authorization.k8s.io
        kind: ClusterRole
      - group: rbac.authorization.k8s.io
        kind: ClusterRoleBinding
      - group: admissionregistration.k8s.io
        kind: ValidatingWebhookConfiguration
      - group: admissionregistration.k8s.io
        kind: MutatingWebhookConfiguration

  - name: spegel
    description: "Spegel — stateless cluster-local P2P OCI registry mirror"
    destinations:
      - namespace: spegel
    sourceRepos:
      - https://github.com/mkroman/k8s
    # Opt out of the default namespace blacklist (which forbids NetworkPolicy,
    # ResourceQuota and LimitRange) with an explicit allowlist of what the
    # chart deploys: the DHT NetworkPolicy requires it. Pod covers the
    # post-delete cleanup hook, Job/Role/RoleBinding the kind e2e probe.
    namespaceResourceWhitelist:
      - group: ""
        kind: Pod
      - group: ""
        kind: Service
      - group: ""
        kind: ServiceAccount
      - group: apps
        kind: DaemonSet
      - group: batch
        kind: Job
      - group: networking.k8s.io
        kind: NetworkPolicy
      - group: rbac.authorization.k8s.io
        kind: Role
      - group: rbac.authorization.k8s.io
        kind: RoleBinding
      - group: monitoring.coreos.com
        kind: ServiceMonitor
      # Optional upstream VerticalPodAutoscaler, rendered only when enabled
      # and the VPA CRD is installed.
      - group: autoscaling.k8s.io
        kind: VerticalPodAutoscaler

  - name: traefik
    description: "Traefik ingress controller"
    destinations:
      - namespace: traefik
    sourceRepos:
      - https://github.com/mkroman/k8s
    clusterResourceWhitelist:
      - group: apiextensions.k8s.io
        kind: CustomResourceDefinition
      - group: rbac.authorization.k8s.io
        kind: ClusterRole
      - group: rbac.authorization.k8s.io
        kind: ClusterRoleBinding
      - group: networking.k8s.io
        kind: IngressClass
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      syncOptions:
        - ApplyOutOfSyncOnly=true
        - ServerSideApply=true

  - name: vector-agent
    description: "Node-local observability agent"
    destinations:
      - namespace: vector
    sourceRepos:
      - https://github.com/mkroman/k8s
    clusterResourceWhitelist:
      - group: rbac.authorization.k8s.io
        kind: ClusterRole
      - group: rbac.authorization.k8s.io
        kind: ClusterRoleBinding
    namespaceResourceWhitelist:
      - group: ""
        kind: ConfigMap
      - group: ""
        kind: Service
      - group: ""
        kind: ServiceAccount
      - group: apps
        kind: DaemonSet
      - group: batch
        kind: Job
      - group: networking.k8s.io
        kind: NetworkPolicy
      - group: monitoring.coreos.com
        kind: PodMonitor

  - name: vector-aggregator
    description: "Cluster observability aggregator"
    destinations:
      - namespace: vector
    sourceRepos:
      - https://github.com/mkroman/k8s
    clusterResourceWhitelist:
      - group: rbac.authorization.k8s.io
        kind: ClusterRole
      - group: rbac.authorization.k8s.io
        kind: ClusterRoleBinding
    namespaceResourceWhitelist:
      - group: ""
        kind: ConfigMap
      - group: ""
        kind: Service
      - group: ""
        kind: ServiceAccount
      - group: apps
        kind: StatefulSet
      - group: networking.k8s.io
        kind: NetworkPolicy
      - group: monitoring.coreos.com
        kind: PodMonitor

  - name: zeta
    description: "Zeta IRC bot with plugins"
    destinations:
      - namespace: zeta-dev
      - namespace: zeta-magistr
      - namespace: zeta-prod
    sourceRepos:
      - https://github.com/mkroman/k8s
    namespaceResourceBlacklist:
      - group: ""
        kind: ResourceQuota
      - group: ""
        kind: LimitRange

  - name: zigbee2mqtt
    description: "Zigbee2MQTT — Zigbee to MQTT bridge with a USB coordinator"
    destinations:
      - namespace: zigbee2mqtt
    sourceRepos:
      - https://github.com/mkroman/k8s
    namespaceResourceWhitelist:
      - group: ""
        kind: ConfigMap
      - group: ""
        kind: PersistentVolumeClaim
      - group: ""
        kind: Service
      - group: apps
        kind: StatefulSet
      - group: networking.k8s.io
        kind: NetworkPolicy
      # The e2e PostSync probe runs as a Job in this namespace (kind-only
      # values enable it; production leaves e2e.enabled false).
      - group: batch
        kind: Job
      # Commit the MQTT password as a SealedSecret under the chart before the
      # first sync; the StatefulSet mounts it and cannot start without it.
      - group: bitnami.com
        kind: SealedSecret

# List of namespaces to create.
namespaces:
  - name: agentgateway-system
    labels:
      # Enforce the restricted Pod Security Standard on the agentgateway
      # control plane namespace.
      pod-security.kubernetes.io/enforce: restricted
      pod-security.kubernetes.io/enforce-version: latest
      pod-security.kubernetes.io/audit: restricted
      pod-security.kubernetes.io/audit-version: latest
      pod-security.kubernetes.io/warn: restricted
      pod-security.kubernetes.io/warn-version: latest
  - name: cert-manager
  - name: chadgpt
  - name: chadgpt-magistr
  - name: grafana
  - name: longhorn-system
  - name: monitoring
  - name: magistr-prod
  - name: mosquitto
  - name: mqtt2prometheus
  - name: nats
  - name: node-feature-discovery
  - name: prometheus-operator
  - name: quickwit-prod
  - name: renovate
  - name: rwx-redis-prod
  - name: rwx-openwebui-prod
  - name: spegel
    labels:
      # Spegel runs privileged by design (hostPath containerd socket, content
      # store, certs.d writes); make the exception explicit instead of relying
      # on the unlabeled namespace default.
      pod-security.kubernetes.io/enforce: privileged
      pod-security.kubernetes.io/enforce-version: latest
      pod-security.kubernetes.io/audit: privileged
      pod-security.kubernetes.io/audit-version: latest
      pod-security.kubernetes.io/warn: privileged
      pod-security.kubernetes.io/warn-version: latest
  - name: traefik
  - name: vector
  - name: zeta-dev
  - name: zeta-magistr
  - name: zeta-prod
  - name: zigbee2mqtt
    labels:
      # The USB coordinator is passed with hostPath and the Zigbee2MQTT
      # container runs privileged (a hostPath device is not added to the
      # container device cgroup). Baseline and restricted Pod Security
      # Standards forbid both, so mark the namespace privileged explicitly
      # instead of relying on the unlabeled namespace default.
      pod-security.kubernetes.io/enforce: privileged
      pod-security.kubernetes.io/enforce-version: latest
      pod-security.kubernetes.io/audit: privileged
      pod-security.kubernetes.io/audit-version: latest
      pod-security.kubernetes.io/warn: privileged
      pod-security.kubernetes.io/warn-version: latest

applications:
  - name: agentgateway
    project: agentgateway
    destination:
      namespace: agentgateway-system
    source:
      repoURL: https://github.com/mkroman/k8s
      path: agentgateway
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      syncOptions:
        - ApplyOutOfSyncOnly=true
        # The CRDs from the agentgateway-crds dependency are part of this
        # release and too large for client-side apply.
        - ServerSideApply=true
      retry:
        limit: 5
        backoff:
          duration: 5s
          factor: 2
          maxDuration: 3m

  - name: cert-manager
    project: cert-manager
    source:
      repoURL: https://github.com/mkroman/k8s
      path: cert-manager

  - name: chadgpt
    project: chadgpt
    source:
      repoURL: https://github.com/mkroman/k8s
      path: chadgpt

  - name: chadgpt-magistr
    project: chadgpt-magistr
    source:
      repoURL: https://github.com/mkroman/k8s
      path: chadgpt
      helm:
        valueFiles:
          - values-magistr.yaml

  - name: cloudnative-pg
    project: cloudnative-pg
    destination:
      namespace: cnpg-system
    source:
      repoURL: https://github.com/mkroman/k8s
      path: cloudnative-pg
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      syncOptions:
        - ApplyOutOfSyncOnly=true
        # We need to use server-side apply because the CRD metadata is too large.
        - ServerSideApply=true

  # Gateway API CRDs must be installed before the agentgateway control plane,
  # hence the earlier sync wave.
  - name: gateway-api
    annotations:
      argocd.argoproj.io/sync-wave: "-1"
    project: agentgateway
    destination:
      namespace: agentgateway-system
    source:
      repoURL: https://github.com/mkroman/k8s
      path: gateway-api
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      syncOptions:
        - ApplyOutOfSyncOnly=true
        # The CRD metadata is too large for client-side apply.
        - ServerSideApply=true
      retry:
        limit: 5
        backoff:
          duration: 5s
          factor: 2
          maxDuration: 3m

  - name: grafana
    project: monitoring
    destination:
      namespace: grafana
    source:
      repoURL: https://github.com/mkroman/k8s
      path: grafana

  - name: longhorn
    finalizers:
      - resources-finalizer.argocd.argoproj.io/foreground
      # The pre-delete-finalizer hook is necessary because of how longhorn deploys
      # jobs on hooks. Argo CD only recognises these unqualified names, so they
      # still trigger Kubernetes' finalizer warning.
      - pre-delete-finalizer.argocd.argoproj.io
      - pre-delete-finalizer.argocd.argoproj.io/cleanup
    project: longhorn
    destination:
      namespace: longhorn-system
    source:
      repoURL: https://github.com/mkroman/k8s
      path: longhorn

  - name: magistr
    project: magistr
    destination:
      namespace: magistr-prod
    source:
      repoURL: https://github.com/mkroman/k8s
      path: magistr
      helm:
        valueFiles:
          - values-prod.yaml

  - name: monitoring
    project: monitoring
    destination:
      namespace: monitoring
    source:
      repoURL: https://github.com/mkroman/k8s
      path: monitoring

  - name: cluster-exporters
    project: monitoring
    destination:
      namespace: monitoring
    source:
      repoURL: https://github.com/mkroman/k8s
      path: monitoring/cluster-exporters

  - name: mosquitto
    project: mosquitto
    destination:
      namespace: mosquitto
    source:
      repoURL: https://github.com/mkroman/k8s
      path: mosquitto

  - name: mqtt2prometheus
    project: mqtt2prometheus
    destination:
      namespace: mqtt2prometheus
    source:
      repoURL: https://github.com/mkroman/k8s
      path: mqtt2prometheus

  - name: mqtt2prometheus-mqtt-topic
    project: mqtt2prometheus
    destination:
      namespace: mqtt2prometheus
    source:
      repoURL: https://github.com/mkroman/k8s
      path: mqtt2prometheus
      helm:
        valueFiles:
          - values-topic-metrics.yaml

  - name: mumble
    project: mumble
    destination:
      namespace: rwx
    source:
      repoURL: https://github.com/mkroman/k8s
      path: mumble

  - name: nats
    project: nats
    destination:
      namespace: nats
    source:
      repoURL: https://github.com/mkroman/k8s
      path: nats

  - name: node-feature-discovery
    project: node-feature-discovery
    destination:
      namespace: node-feature-discovery
    source:
      repoURL: https://github.com/mkroman/k8s
      path: node-feature-discovery

  - name: open-webui
    project: open-webui
    destination:
      namespace: rwx-openwebui-prod
    source:
      repoURL: https://github.com/mkroman/k8s
      path: open-webui

  - name: postgres
    project: rwx
    useDefaultFinalizers: false # We don't accidentally want to delete a postgres cluster
    destination:
      namespace: rwx
    source:
      repoURL: https://github.com/mkroman/k8s
      path: postgres

  - name: prometheus-operator
    project: prometheus-operator
    destination:
      namespace: prometheus-operator
    source:
      repoURL: https://github.com/mkroman/k8s
      path: prometheus-operator
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      syncOptions:
        - ApplyOutOfSyncOnly=true
        # We need to use server-side apply because the CRD metadata is too large.
        - ServerSideApply=true

  - name: quickwit
    annotations:
      argocd.argoproj.io/sync-wave: "2"
    project: quickwit
    destination:
      namespace: quickwit-prod
    source:
      repoURL: https://github.com/mkroman/k8s
      path: quickwit

  - name: redis
    project: redis
    destination:
      namespace: rwx-redis-prod
    source:
      repoURL: https://github.com/mkroman/k8s
      path: redis

  - name: renovate
    project: renovate
    source:
      repoURL: https://github.com/mkroman/k8s
      path: renovate

  - name: sealed-secrets
    project: sealed-secrets
    destination:
      namespace: kube-system
    source:
      repoURL: https://github.com/mkroman/k8s
      path: sealed-secrets

  - name: spegel
    project: spegel
    destination:
      namespace: spegel
    source:
      repoURL: https://github.com/mkroman/k8s
      path: spegel
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      syncOptions:
        - ApplyOutOfSyncOnly=true
        - ServerSideApply=true
      retry:
        limit: 5
        backoff:
          duration: 5s
          factor: 2
          maxDuration: 3m

  - name: traefik
    project: traefik
    destination:
      namespace: traefik
    source:
      repoURL: https://github.com/mkroman/k8s
      path: traefik

  - name: vector-agent
    project: vector-agent
    destination:
      namespace: vector
    source:
      repoURL: https://github.com/mkroman/k8s
      path: vector
      helm:
        valueFiles:
          - values-agent.yaml

  - name: vector-aggregator
    project: vector-aggregator
    destination:
      namespace: vector
    source:
      repoURL: https://github.com/mkroman/k8s
      path: vector
      helm:
        valueFiles:
          - values-aggregator.yaml

  - name: zeta
    annotations:
      argocd.argoproj.io/sync-wave: "2"
    project: zeta
    destination:
      namespace: zeta-prod
    source:
      repoURL: https://github.com/mkroman/k8s
      path: zeta
      helm:
        valueFiles:
          - values-prod.yaml

  - name: zeta-magistr
    annotations:
      argocd.argoproj.io/sync-wave: "2"
    project: zeta
    destination:
      namespace: zeta-magistr
    source:
      repoURL: https://github.com/mkroman/k8s
      path: zeta
      helm:
        valueFiles:
          - values-magistr.yaml

  # Depends on mosquitto for MQTT and node-feature-discovery for the coordinator
  # label. The Pod stays Pending until both are available. The StatefulSet also
  # mounts the `zigbee2mqtt-secrets` Secret, so commit the SealedSecret
  # described in zigbee2mqtt/README.md before the first sync.
  - name: zigbee2mqtt
    annotations:
      argocd.argoproj.io/sync-wave: "2"
    project: zigbee2mqtt
    destination:
      namespace: zigbee2mqtt
    source:
      repoURL: https://github.com/mkroman/k8s
      path: zigbee2mqtt
