apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "zeta.fullname" . }}
  labels:
    {{- include "zeta.labels" . | nindent 4 }}
data:
  config.toml: |
    # Generated by the zeta Helm chart from the `zeta` values -- do not edit.
    #
    # Every value can also be overridden through `ZETA_`-prefixed environment variables, where
    # `__` separates sections (e.g. `ZETA_IRC__NICK_PASSWORD`); the environment always wins.

    {{- with .Values.zeta.database }}
    [database]
    url = {{ .url | toJson }}
    {{- with .idle_timeout }}
    idle_timeout = {{ . | toJson }}
    {{- end }}
    {{- with .max_connections }}
    max_connections = {{ . }}
    {{- end }}
    {{- end }}

    {{- with .Values.zeta.irc }}
    [irc]
    nickname = {{ .nickname | toJson }}
    alt_nicks = {{ .alt_nicks | toJson }}
    hostname = {{ .hostname | toJson }}
    {{- with .port }}
    port = {{ . }}
    {{- end }}
    {{- with .username }}
    username = {{ . | toJson }}
    {{- end }}
    {{- with .realname }}
    realname = {{ . | toJson }}
    {{- end }}
    {{- with .password }}
    password = {{ . | toJson }}
    {{- end }}
    {{- with .nick_password }}
    nick_password = {{ . | toJson }}
    {{- end }}
    {{- if hasKey . "should_ghost" }}
    should_ghost = {{ ternary "true" "false" .should_ghost }}
    {{- end }}
    {{- with .encoding }}
    encoding = {{ . | toJson }}
    {{- end }}
    {{- with .admin_hostmasks }}
    admin_hostmasks = {{ . | toJson }}
    {{- end }}
    {{- with .tls }}
    [irc.tls]
    enabled = {{ ternary "true" "false" .enabled }}
    {{- end }}
    {{- range .channels }}
    [[irc.channels]]
    name = {{ .name | toJson }}
    {{- with .key }}
    key = {{ . | toJson }}
    {{- end }}
    {{- end }}
    {{- end }}

    {{- with .Values.zeta.http }}
    [http]
    {{- with .timeout }}
    timeout = {{ . | toJson }}
    {{- end }}
    {{- with .user_agent }}
    user_agent = {{ . | toJson }}
    {{- end }}
    {{- end }}

    {{- with .Values.zeta.mirror }}
    [mirror]
    {{- with .download_dir }}
    download_dir = {{ . | toJson }}
    {{- end }}
    {{- with .max_filesize }}
    max_filesize = {{ . | toJson }}
    {{- end }}
    {{- with .download_timeout }}
    download_timeout = {{ . | toJson }}
    {{- end }}
    {{- with .max_concurrent_downloads }}
    max_concurrent_downloads = {{ . }}
    {{- end }}
    {{- with .ytdlp_command }}
    ytdlp_command = {{ . | toJson }}
    {{- end }}
    {{- with .s3_access_key_id }}
    s3_access_key_id = {{ . | toJson }}
    {{- end }}
    {{- with .s3_secret_access_key }}
    s3_secret_access_key = {{ . | toJson }}
    {{- end }}
    {{- with .s3_bucket_name }}
    s3_bucket_name = {{ . | toJson }}
    {{- end }}
    {{- with .s3_region }}
    s3_region = {{ . | toJson }}
    {{- end }}
    {{- with .s3_endpoint }}
    s3_endpoint = {{ . | toJson }}
    {{- end }}
    {{- end }}

    {{- with .Values.zeta.plugins }}
    {{- range $name, $section := . }}
    {{- if kindIs "map" $section }}
    {{- if gt (len $section) 0 }}
    [plugins.{{ $name }}]
    {{- range $key, $value := $section }}
    {{- if not (kindIs "invalid" $value) }}
    {{ $key }} = {{ include "zeta.toTomlValue" $value }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}

    {{- with .Values.zeta.tracing }}
    [tracing]
    enabled = {{ ternary "true" "false" .enabled }}
    {{- end }}
