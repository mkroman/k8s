# ScrapeConfig authorizes with a Secret reference; unlike ServiceMonitor it has
# no `bearerTokenFile` field in prometheus-operator v0.94.1. This long-lived
# token belongs to the Prometheus ServiceAccount and is limited to the
# ClusterRole in ../base/manifests/clusterrole.yaml.
#
# The token controller populates the Secret. Rotate it by deleting the Secret;
# the controller recreates the token and the operator reloads the scrape
# configuration. The ServiceMonitors use the pod's short-lived projected token
# instead, so this Secret is only needed by the scheduler and
# controller-manager ScrapeConfigs.
apiVersion: v1
kind: Secret
metadata:
  name: prometheus-scrape-token
  labels:
    app.kubernetes.io/name: prometheus
  annotations:
    kubernetes.io/service-account.name: prometheus
type: kubernetes.io/service-account-token
