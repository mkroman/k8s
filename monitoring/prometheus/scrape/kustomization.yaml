apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The Prometheus CR selects every scrape resource carrying this label. Keep the
# label in one transformer so adding a target only means adding a resource file
# and a line below. includeSelectors stays false: ServiceMonitor selectors must
# keep matching the Services they were written for.
labels:
  - pairs:
      app.kubernetes.io/part-of: monitoring
      metrics.uplink.io/monitor: prometheus
    includeSelectors: false

resources:
  - ./secret.scrape-token.yaml
  - ./servicemonitor.kubelet.yaml
  - ./servicemonitor.coredns.yaml
  - ./servicemonitor.kube-apiserver.yaml
  - ./scrapeconfig.kube-scheduler.yaml
  - ./scrapeconfig.kube-controller-manager.yaml
