apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: argocd
  labels:
    metrics.uplink.io/monitor: prometheus
spec:
  groups:
    - name: argocd.applications
      rules:
        # The root Application deliberately ignores workload health (see
        # apps/templates/newapplications.yaml), so workload health is alerted
        # on directly instead of through the app-of-apps root.
        - alert: ArgoCDAppDegraded
          expr: argocd_app_info{health_status="Degraded"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Argo CD application {{ $labels.name }} is degraded"
            description: >-
              Application {{ $labels.name }} has reported Degraded health for
              more than 5 minutes.

        - alert: ArgoCDAppOutOfSync
          expr: argocd_app_info{sync_status="OutOfSync"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Argo CD application {{ $labels.name }} is out of sync"
            description: >-
              Application {{ $labels.name }} has been OutOfSync for more than
              15 minutes, so the cluster has drifted from Git.

        - alert: ArgoCDSyncFailed
          expr: increase(argocd_app_sync_total{phase=~"Error|Failed"}[10m]) > 0
          labels:
            severity: warning
          annotations:
            summary: "Argo CD sync failed for {{ $labels.name }}"
            description: >-
              Application {{ $labels.name }} has reported at least one failed
              sync operation in the last 10 minutes.
