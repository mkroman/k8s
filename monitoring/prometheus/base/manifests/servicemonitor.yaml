apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
    metrics.uplink.io/monitor: prometheus
spec:
  jobLabel: app.kubernetes.io/name
  endpoints:
  - interval: 30s
    port: web
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
      app.kubernetes.io/instance: prometheus
      self-monitor: "true"
