apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: monitoring
    app.kubernetes.io/managed-by: prometheus-operator
spec:
  # The production overlay sets two replicas. The base stays at one so an
  # ephemeral environment can run it without a second PVC or anti-affinity.
  replicas: 1

  serviceAccountName: prometheus

  ruleSelector:
    matchLabels:
      metrics.uplink.io/monitor: prometheus

  ruleNamespaceSelector:
    matchLabels: {}

  podMonitorNamespaceSelector:
    # Monitor pods in all namespaces
    matchLabels: {}

  podMonitorSelector:
    matchLabels:
      metrics.uplink.io/monitor: prometheus

  serviceMonitorNamespaceSelector:
    # Monitor services in all namespaces
    matchLabels: {}

  serviceMonitorSelector:
    matchLabels:
      metrics.uplink.io/monitor: prometheus

  # ScrapeConfigs cover targets that cannot be expressed as a ServiceMonitor,
  # currently the kube-scheduler and kube-controller-manager static pods.
  scrapeConfigSelector:
    matchLabels:
      metrics.uplink.io/monitor: prometheus

  scrapeConfigNamespaceSelector:
    matchLabels: {}

  securityContext:
    # Prometheus runs as nobody and needs to write its data directory, whether
    # that is a PVC in production or an emptyDir in an ephemeral environment.
    runAsUser: 65534
    fsGroup: 65534
