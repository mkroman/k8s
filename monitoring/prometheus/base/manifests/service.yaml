apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: monitoring
    self-monitor: "true"
spec:
  type: ClusterIP
  ports:
  - name: web
    port: 9090
    targetPort: web
  # Match the Prometheus Operator pod labels. The e2e harness also
  # port-forwards to this Service to query the target API.
  selector:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: prometheus
