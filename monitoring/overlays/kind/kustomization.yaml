apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

# The kind environment runs the same Prometheus base and scrape targets as
# production, without Alertmanager, Thanos, ingress or a PVC. The e2e harness
# checks the target API after the Application is healthy.
resources:
  - ../../prometheus/overlays/kind
