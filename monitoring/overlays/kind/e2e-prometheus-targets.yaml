apiVersion: batch/v1
kind: Job
metadata:
  name: e2e-prometheus-targets
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 0
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: check-targets
          image: mirror.gcr.io/library/python:3.13-alpine@sha256:7712cfd23e0501f5cb58faa5e6e0d515c9939bdbce866921799b31e696a1d13c
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          command:
            - python3
            - -c
            - |
              import json
              import sys
              import time
              import urllib.request

              expected = {
                  "kubelet": ("kubelet",),
                  "coredns": ("kube-dns", "coredns"),
                  "apiserver": ("apiserver",),
                  "kube-scheduler": ("kube-scheduler",),
                  "kube-controller-manager": ("kube-controller-manager",),
              }
              url = "http://prometheus-operated.monitoring.svc:9090/api/v1/targets?state=active"
              deadline = time.time() + 540
              last_error = "Prometheus was not queried"

              while time.time() < deadline:
                  try:
                      with urllib.request.urlopen(url, timeout=10) as response:
                          payload = json.load(response)
                      health = {}
                      for target in payload["data"]["activeTargets"]:
                          job = target.get("labels", {}).get("job")
                          if job:
                              health[job] = target.get("health")
                      problems = []
                      for label, jobs in expected.items():
                          values = {job: health[job] for job in jobs if job in health}
                          if not values or any(value != "up" for value in values.values()):
                              problems.append(f"{label}: {values or 'missing'}")
                      if not problems:
                          print("all expected scrape targets are up")
                          print(json.dumps(health, indent=2, sort_keys=True))
                          sys.exit(0)
                      last_error = "; ".join(problems)
                  except Exception as error:
                      last_error = f"{type(error).__name__}: {error}"
                  time.sleep(5)

              print(f"scrape targets did not become healthy: {last_error}")
              sys.exit(1)
