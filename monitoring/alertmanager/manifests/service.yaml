apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/instance: cluster
    app.kubernetes.io/component: alert-router
    app.kubernetes.io/part-of: monitoring
    self-monitor: "true"
spec:
  type: ClusterIP
  ports:
    - name: web
      port: 9093
      protocol: TCP
      targetPort: web
  selector:
    app.kubernetes.io/name: alertmanager
    alertmanager: cluster
