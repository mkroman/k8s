apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: alertmanager
  labels:
    app.kubernetes.io/name: alertmanager
    metrics.uplink.io/monitor: prometheus
spec:
  jobLabel: app.kubernetes.io/name
  endpoints:
  - interval: 30s
    port: web
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
      app.kubernetes.io/instance: cluster
      self-monitor: "true"
