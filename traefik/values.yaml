traefik:
  accessLog:
    enabled: false
    format: json
    otlp:
      http:
        endpoint: http://vector-aggregator.vector.svc.cluster.local:4318/v1/logs

  deployment:
    # Deploy multiple replicas.
    replicas: 3

  experimental:
    otlpLogs: true

  global:
    # Disable sending of anonymous usage statistics.
    sendAnonymousUsage: false
    # Don't check for new versions.
    checkNewVersion: false

  instanceLabelOverride: traefik

  image:
    repository: traefik
    tag: v3.7.16@sha256:1336e85aaed293bd63d005086e0dd013b04078b26aaeb1c18b26a2f928af7e65

  log:
    format: json
    level: INFO

  metrics:
    # Enable prometheus metrics
    prometheus:
      service:
        enabled: true
      disableAPICheck: true # Disable API check of e.g. ServiceMonitor CRDs.
      serviceMonitor:
        enabled: true
        additionalLabels:
          metrics.uplink.io/monitor: prometheus
        jobLabel: app.kubernetes.io/instance
      prometheusRule:
        enabled: true
        additionalLabels:
          prometheus: k8s
        rules:
          - alert: TraefikDown
            expr: up{job="traefik"} == 0
            for: 5m
            labels:
              context: traefik
              severity: warning
            annotations:
              summary: "Traefik Down"
              description: "{{ $labels.pod }} on {{ $labels.nodename }} is down"

  ports:
    web:
      transport:
        respondingTimeouts:
          readTimeout: "0s"
          idleTimeout: "0s"
    websecure:
      transport:
        respondingTimeouts:
          readTimeout: "0s"
          idleTimeout: "0s"

  # Configuration providers.
  providers:
    # Enable Kubernetes CRD provider.
    kubernetesCRD:
      enabled: true
      # Allow IngressRoutes to reference resources in other namespaces
      allowCrossNamespace: true

  service:
    annotations:
      lbipam.cilium.io/ips: 10.0.3.1
      lbipam.cilium.io/sharing-key: traefik
    spec:
      # Use a local traffic policy so we can get the users origin ip
      externalTrafficPolicy: Local
